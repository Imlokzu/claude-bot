<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pomodoro</title>
  <style>
    /* Shared look of the bot's own apps: the screen palette (skins overwrite
       these eight variables at runtime), one bar, one button, one segment. */
    :root {
      --bg: #16181a; --panel: #1e2124; --line: #2f3438; --text: #e8e4dc;
      --muted: #8e9498; --accent: #d17a58; --ok: #8ca879; --off: #6b7175;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #efe7d9; --panel: #fbf6ec; --line: #ddcdb2; --text: #2f271f;
      --muted: #7d6d5c; --accent: #b95f3d; --ok: #6f8b5f; --off: #a8998a;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; color: inherit; }
    .app { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; padding: 6px 8px 8px; gap: 6px; }
    .bar { display: flex; align-items: center; gap: 6px; flex: none; min-height: 28px; }
    .bar-title { flex: 1; min-width: 0; overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .chip { display: inline-flex; align-items: baseline; gap: 4px; flex: none; padding: 4px 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .chip b { color: var(--text); font-size: 12px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none; min-width: 28px; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 11px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .btn:active { border-color: var(--accent); color: var(--accent); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: var(--bg); }
    .btn.primary:active { opacity: .75; color: var(--bg); }
    .btn.icon { width: 28px; padding: 0; }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .35; pointer-events: none; }
    .seg { display: flex; gap: 6px; flex: none; padding: 2px; border: 1px solid var(--line); border-radius: 9px; }
    .seg button { flex: 1; min-width: 0; min-height: 24px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
    .seg button.on { background: var(--panel); color: var(--text); }
    .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
    .main { display: flex; flex: 1; min-height: 0; gap: 8px; }
    .ring-box { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 0; }
    .ring { position: relative; }
    .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 5; }
    .track { stroke: var(--line); }
    .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .break .arc { stroke: var(--ok); }
    .ring-copy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .time { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .phase { color: var(--accent); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .break .phase { color: var(--ok); }
    .paused .time { opacity: .6; }
    .side { display: flex; flex-direction: column; gap: 6px; width: 118px; flex: none; }
    .stepper { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .stepper-mid { display: flex; flex: 1; min-width: 0; flex-direction: column; align-items: center; }
    .stepper-label { max-width: 100%; overflow: hidden; color: var(--muted); font-size: 7.5px; font-weight: 700; letter-spacing: .08em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .stepper-value { font-size: 13px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stepper .btn { width: 24px; min-width: 24px; min-height: 24px; border-radius: 7px; background: transparent; }
    .side .spacer { flex: 1; }
    .row { display: flex; gap: 6px; }
    .row .btn { flex: 1; }
    #toggle { width: 100%; }
    .dots { display: flex; justify-content: center; gap: 5px; min-height: 8px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .dots i.on { background: var(--accent); }
    @media (max-height: 200px) { .side { gap: 5px; } .side .btn { min-height: 24px; } .stepper { padding-block: 1px; } .dots { display: none; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="bar">
      <span class="bar-title" data-i18n="title"></span>
      <span class="chip"><span data-i18n="today"></span><b id="count">0</b></span>
    </header>
    <main class="main">
      <div class="ring-box" id="ringBox">
        <div class="ring" id="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="arc" id="arc" cx="50" cy="50" r="44"/></svg>
          <div class="ring-copy"><div class="time" id="time">25:00</div><div class="phase" id="phase"></div></div>
        </div>
      </div>
      <aside class="side">
        <div class="stepper">
          <button class="btn icon" type="button" data-step="focus:-5" data-icon="minus" data-i18n-aria="less"></button>
          <span class="stepper-mid"><span class="stepper-value" id="focusMin"></span><span class="stepper-label" data-i18n="focus"></span></span>
          <button class="btn icon" type="button" data-step="focus:5" data-icon="plus" data-i18n-aria="more"></button></div>
        <div class="stepper">
          <button class="btn icon" type="button" data-step="break:-1" data-icon="minus" data-i18n-aria="less"></button>
          <span class="stepper-mid"><span class="stepper-value" id="breakMin"></span><span class="stepper-label" data-i18n="break"></span></span>
          <button class="btn icon" type="button" data-step="break:1" data-icon="plus" data-i18n-aria="more"></button></div>
        <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
        <span class="spacer"></span>
        <button class="btn primary" id="toggle" type="button"></button>
        <div class="row">
          <button class="btn" id="reset" type="button" data-icon="reset" data-i18n-aria="reset"></button>
          <button class="btn" id="skip" type="button" data-icon="next" data-i18n-aria="skip"></button>
        </div>
      </aside>
    </main>
  </div>
  <script>
    const APP_ID = "pomodoro";
    const STR = {
      uk: {
        title: "Помодоро", today: "Сьогодні", focus: "Фокус", break: "Перерва", start: "Старт", pause: "Пауза", resume: "Далі",
        reset: "Скинути", skip: "Пропустити етап", less: "Менше", more: "Більше", min: "хв",
      },
      en: {
        title: "Pomodoro", today: "Today", focus: "Focus", break: "Break", start: "Start", pause: "Pause", resume: "Resume",
        reset: "Reset", skip: "Skip phase", less: "Less", more: "More", min: "min",
      },
    };
    const ICONS = {
      minus: '<path d="M5 12h14"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      play: '<path d="M8 5.4v13.2L19.2 12z"/>',
      pause: '<path d="M8.6 5.5v13M15.4 5.5v13"/>',
      reset: '<path d="M20 11a8 8 0 0 0-14.8-3L3 11m0 0V6m0 5h5M4 13a8 8 0 0 0 14.8 3L21 13m0 0v5m0-5h-5"/>',
      next: '<path d="M6.5 5.5v13L15.8 12z"/><path d="M17.5 5.5v13"/>'
    };
    /* ---- shared app runtime: storage, i18n, skin, parent messages ---- */

    // Storage throws inside a sandboxed iframe (a shared .cbp runs with an
    // opaque origin), so every access is guarded and the app keeps its state
    // in memory instead of failing.
    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(APP_ID + "." + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
    }

    // Start in the screen's language; botSkin carries it later, which also
    // covers the sandbox where localStorage is not readable.
    let lang = "uk";
    try { lang = localStorage.getItem("botScreenLang") || "uk"; } catch (_) {}
    if (lang !== "en") lang = "uk";

    function t(key, vars) {
      let text = STR[lang][key];
      if (text == null) text = STR.uk[key];
      if (text == null) return key;
      if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
      return text;
    }
    function icon(name, cls) {
      return '<svg class="i' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
    }
    function fillIcons(root) {
      (root || document).querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
    }
    function applyI18n() {
      document.documentElement.lang = lang;
      document.title = t("title");
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
      if (typeof onLang === "function") onLang();
    }
    // "*" on purpose: in a sandbox our origin is "null", and naming a real
    // origin as the target would silently drop the message.
    function post(message) {
      try { window.parent.postMessage(message, "*"); } catch (_) {}
    }
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    let skinKeys = [];
    window.addEventListener("message", (event) => {
      // Only the source is checked: a sandboxed frame sees origin "null".
      if (event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.type !== "botSkin") return;
      const root = document.documentElement;
      // Drop the previous skin first, otherwise removing a skin would leave
      // its colours behind.
      skinKeys.forEach((key) => root.style.removeProperty(key));
      skinKeys = [];
      if (data.vars && typeof data.vars === "object") {
        for (const key in data.vars) {
          if (!/^--[a-z-]+$/.test(key)) continue;
          root.style.setProperty(key, String(data.vars[key]));
          skinKeys.push(key);
        }
      }
      root.dataset.theme = data.theme === "light" ? "light" : "dark";
      if (typeof onTheme === "function") onTheme();
      if ((data.lang === "uk" || data.lang === "en") && data.lang !== lang) {
        lang = data.lang;
        applyI18n();
      }
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-close]")) post({ type: "closeStoreApp" });
    });
    // Swipe left/right/down closes the app, same gesture as the screen's own
    // layers. Pointer capture keeps the swipe alive when the finger leaves a
    // small element; a native scroll cancels the pointer and is not a swipe.
    function enableSwipeClose(root) {
      let start = null;
      root.addEventListener("pointerdown", (event) => {
        if (start || event.target.closest("input, select, textarea, [data-noswipe]")) return;
        start = { x: event.clientX, y: event.clientY, id: event.pointerId };
        if (!event.target.closest("button")) {
          try { root.setPointerCapture(event.pointerId); } catch (_) {}
        }
      });
      function finish(event) {
        if (!start || start.id !== event.pointerId) return;
        const s = start;
        start = null;
        try { if (root.hasPointerCapture(s.id)) root.releasePointerCapture(s.id); } catch (_) {}
        if (event.type === "pointercancel") return;
        const dx = event.clientX - s.x;
        const dy = event.clientY - s.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
        if (Math.abs(dx) >= Math.abs(dy)) post({ type: "storeAppSwipe", direction: dx < 0 ? "left" : "right" });
        else if (dy > 0) post({ type: "storeAppSwipe", direction: "down" });
      }
      root.addEventListener("pointerup", finish);
      root.addEventListener("pointercancel", finish);
      window.addEventListener("pointerup", finish);
      window.addEventListener("pointercancel", finish);
      root.addEventListener("lostpointercapture", (event) => { if (start && start.id === event.pointerId) start = null; });
    }

    const CIRC = 2 * Math.PI * 44;
    const arc = document.getElementById("arc");
    arc.style.strokeDasharray = CIRC.toFixed(2);

    const settings = Object.assign({ focus: 25, break: 5 }, load("settings", {}));
    settings.focus = clamp(Number(settings.focus) || 25, 15, 50);
    settings.break = clamp(Number(settings.break) || 5, 3, 15);
    // endAt is wall-clock, so the timer survives the app being closed and
    // reopened: the iframe dies with the app, the deadline does not.
    let timer = Object.assign({ phase: "focus", running: false, endAt: 0, remaining: settings.focus * 60000 }, load("timer", {}));
    if (timer.phase !== "break") timer.phase = "focus";
    if (!(timer.remaining > 0)) timer.remaining = duration(timer.phase);
    let tickId = 0, audio = null, lastShown = "";

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function todayKey() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
    function todayCount() { const s = load("today", null); return s && s.day === todayKey() ? s.count : 0; }
    function addSession() { save("today", { day: todayKey(), count: todayCount() + 1 }); }
    function duration(phase) { return settings[phase] * 60000; }
    function remaining() { return timer.running ? Math.max(0, timer.endAt - Date.now()) : timer.remaining; }
    function persist() { save("timer", timer); }

    // Short and quiet on purpose: this is a nudge on a desk, not an alarm.
    function beep() {
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audio.currentTime;
        [[660, 0], [880, .22]].forEach(([freq, at]) => {
          const osc = audio.createOscillator(), gain = audio.createGain();
          osc.type = "sine"; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t0 + at);
          gain.gain.exponentialRampToValueAtTime(0.06, t0 + at + .02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + .18);
          osc.connect(gain).connect(audio.destination);
          osc.start(t0 + at); osc.stop(t0 + at + .2);
        });
      } catch (_) {}
    }

    function finishPhase(silent) {
      if (!silent) beep();
      if (timer.phase === "focus") {
        addSession();
        // Focus rolls straight into the break; the next focus waits for a
        // tap, so a missed break never silently eats a work session.
        timer = { phase: "break", running: !silent, endAt: Date.now() + duration("break"), remaining: duration("break") };
      } else {
        timer = { phase: "focus", running: false, endAt: 0, remaining: duration("focus") };
      }
      persist();
      syncTick();
      render(true);
    }

    function syncTick() {
      clearInterval(tickId);
      tickId = timer.running ? setInterval(tick, 250) : 0;
    }
    function tick() {
      if (remaining() <= 0) return finishPhase(false);
      render(false);
    }

    function render(jump) {
      const left = remaining();
      const secs = Math.ceil(left / 1000);
      const shown = String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");
      if (shown !== lastShown || jump) {
        lastShown = shown;
        document.getElementById("time").textContent = shown;
        const frac = 1 - left / duration(timer.phase);
        // Skip the 1s transition on jumps (reset, skip, phase change), or
        // the ring would visibly sweep backwards.
        if (jump) arc.style.transition = "none";
        arc.style.strokeDashoffset = (CIRC * (1 - clamp(frac, 0, 1))).toFixed(2);
        if (jump) { arc.getBoundingClientRect(); arc.style.transition = ""; }
      }
      if (!jump) return;
      const ring = document.getElementById("ring");
      ring.classList.toggle("break", timer.phase === "break");
      ring.classList.toggle("paused", !timer.running && left < duration(timer.phase));
      document.getElementById("phase").textContent = t(timer.phase);
      document.getElementById("focusMin").textContent = settings.focus;
      document.getElementById("breakMin").textContent = settings.break;
      const count = todayCount();
      document.getElementById("count").textContent = count;
      document.querySelectorAll("#dots i").forEach((dot, i) => dot.classList.toggle("on", i < count % 4 || (count > 0 && count % 4 === 0)));
      const toggle = document.getElementById("toggle");
      const label = timer.running ? "pause" : left < duration(timer.phase) ? "resume" : "start";
      toggle.innerHTML = icon(timer.running ? "pause" : "play") + "<span></span>";
      toggle.lastChild.textContent = t(label);
    }

    function layout() {
      const box = document.getElementById("ringBox");
      const size = Math.max(100, Math.floor(Math.min(box.clientWidth, box.clientHeight)));
      const ring = document.getElementById("ring");
      ring.style.width = ring.style.height = size + "px";
      document.getElementById("time").style.fontSize = Math.round(size * .2) + "px";
    }

    document.getElementById("toggle").addEventListener("click", () => {
      // Created on a tap: browsers only let audio start from a gesture.
      try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) {}
      if (timer.running) timer = { ...timer, running: false, remaining: remaining() };
      else timer = { ...timer, running: true, endAt: Date.now() + timer.remaining };
      persist(); syncTick(); render(true);
    });
    document.getElementById("reset").addEventListener("click", () => {
      timer = { phase: "focus", running: false, endAt: 0, remaining: duration("focus") };
      persist(); syncTick(); render(true);
    });
    document.getElementById("skip").addEventListener("click", () => {
      const next = timer.phase === "focus" ? "break" : "focus";
      timer = { phase: next, running: false, endAt: 0, remaining: duration(next) };
      persist(); syncTick(); render(true);
    });
    document.querySelector(".side").addEventListener("click", (event) => {
      const b = event.target.closest("[data-step]");
      if (!b) return;
      const [key, delta] = b.dataset.step.split(":");
      const old = settings[key];
      settings[key] = key === "focus" ? clamp(settings[key] + Number(delta), 15, 50) : clamp(settings[key] + Number(delta), 3, 15);
      save("settings", settings);
      // A phase that has not started yet takes the new length at once.
      if (!timer.running && timer.phase === key && timer.remaining === old * 60000) timer.remaining = duration(key);
      persist(); render(true);
    });
    window.addEventListener("resize", layout);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) tick(); });

    function onLang() { render(true); }

    enableSwipeClose(document.getElementById("app"));
    fillIcons();
    layout();
    if (timer.running && timer.endAt <= Date.now()) finishPhase(true);
    applyI18n();
    syncTick();
  </script>
</body>
</html>
