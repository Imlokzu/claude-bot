name = "agent-mail-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"
account_id = "395d94f0006b619bf9008d3cd0ca3ccf"

routes = [
  { pattern = "mail.waveio.me/*", zone_name = "waveio.me" },
  { pattern = "send.waveio.me/*", zone_name = "waveio.me" }
]

[[kv_namespaces]]
binding = "AG_MAILBOX"
id = "0266ff7e479e4a1fae1e8508639e6edc"

# Secrets are NOT vars: set them with `wrangler secret put <NAME>`.
#   API_KEY              admin key for inbox / OTP endpoints
#   DEFAULT_AGENT_TOKEN  agent token for inbox and /v1/send
#   BREVO_API_KEY        outbound mail provider key
# A value written here is published with the repo.
[vars]
FORWARD_MAIN_DOMAIN_TO = "lokzuhd@gmail.com"
DEFAULT_SENDER_EMAIL = "noreply@waveio.me"


