<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flappy Crab</title>
  <style>
    /* Shared look of the bot's own apps: the screen palette (skins overwrite
       these eight variables at runtime), one bar, one button, one segment. */
    :root {
      --bg: #16181a; --panel: #1e2124; --line: #2f3438; --text: #e8e4dc;
      --muted: #8e9498; --accent: #d17a58; --ok: #8ca879; --off: #6b7175;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #efe7d9; --panel: #fbf6ec; --line: #ddcdb2; --text: #2f271f;
      --muted: #7d6d5c; --accent: #b95f3d; --ok: #6f8b5f; --off: #a8998a;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; color: inherit; }
    .app { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; padding: 6px 8px 8px; gap: 6px; }
    .bar { display: flex; align-items: center; gap: 6px; flex: none; min-height: 28px; }
    .bar-title { flex: 1; min-width: 0; overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .chip { display: inline-flex; align-items: baseline; gap: 4px; flex: none; padding: 4px 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .chip b { color: var(--text); font-size: 12px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none; min-width: 28px; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 11px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .btn:active { border-color: var(--accent); color: var(--accent); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: var(--bg); }
    .btn.primary:active { opacity: .75; color: var(--bg); }
    .btn.icon { width: 28px; padding: 0; }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .35; pointer-events: none; }
    .seg { display: flex; gap: 6px; flex: none; padding: 2px; border: 1px solid var(--line); border-radius: 9px; }
    .seg button { flex: 1; min-width: 0; min-height: 24px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
    .seg button.on { background: var(--panel); color: var(--text); }
    .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
    .stage { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .close { position: absolute; top: 6px; right: 6px; z-index: 2; background: var(--bg); opacity: .85; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="btn icon close" type="button" data-close data-icon="x" data-i18n-aria="close"></button>
  </div>
  <script>
    const APP_ID = "flappy-crab";
    const STR = {
      uk: {
        title: "Крабик", close: "Закрити", tapToFly: "Тап, щоб злетіти", best: "Рекорд: {n}",
        over: "Бульк!", score: "Рахунок: {n}", newBest: "Новий рекорд!", again: "Тап, щоб ще раз",
      },
      en: {
        title: "Flappy Crab", close: "Close", tapToFly: "Tap to fly", best: "Best: {n}",
        over: "Splash!", score: "Score: {n}", newBest: "New best!", again: "Tap to try again",
      },
    };
    const ICONS = {
      x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'
    };
    /* ---- shared app runtime: storage, i18n, skin, parent messages ---- */

    // Storage throws inside a sandboxed iframe (a shared .cbp runs with an
    // opaque origin), so every access is guarded and the app keeps its state
    // in memory instead of failing.
    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(APP_ID + "." + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
    }

    // Start in the screen's language; botSkin carries it later, which also
    // covers the sandbox where localStorage is not readable.
    let lang = "uk";
    try { lang = localStorage.getItem("botScreenLang") || "uk"; } catch (_) {}
    if (lang !== "en") lang = "uk";

    function t(key, vars) {
      let text = STR[lang][key];
      if (text == null) text = STR.uk[key];
      if (text == null) return key;
      if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
      return text;
    }
    function icon(name, cls) {
      return '<svg class="i' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
    }
    function fillIcons(root) {
      (root || document).querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
    }
    function applyI18n() {
      document.documentElement.lang = lang;
      document.title = t("title");
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
      if (typeof onLang === "function") onLang();
    }
    // "*" on purpose: in a sandbox our origin is "null", and naming a real
    // origin as the target would silently drop the message.
    function post(message) {
      try { window.parent.postMessage(message, "*"); } catch (_) {}
    }
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    let skinKeys = [];
    window.addEventListener("message", (event) => {
      // Only the source is checked: a sandboxed frame sees origin "null".
      if (event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.type !== "botSkin") return;
      const root = document.documentElement;
      // Drop the previous skin first, otherwise removing a skin would leave
      // its colours behind.
      skinKeys.forEach((key) => root.style.removeProperty(key));
      skinKeys = [];
      if (data.vars && typeof data.vars === "object") {
        for (const key in data.vars) {
          if (!/^--[a-z-]+$/.test(key)) continue;
          root.style.setProperty(key, String(data.vars[key]));
          skinKeys.push(key);
        }
      }
      root.dataset.theme = data.theme === "light" ? "light" : "dark";
      if (typeof onTheme === "function") onTheme();
      if ((data.lang === "uk" || data.lang === "en") && data.lang !== lang) {
        lang = data.lang;
        applyI18n();
      }
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-close]")) post({ type: "closeStoreApp" });
    });

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    const stage = document.getElementById("stage");

    // The crab, 13x9, drawn with fillRect so it stays pixel-crisp on the
    // Pi's panel. 1 = shell, 2 = eye, 3 = claw. Two frames: claws up after
    // a flap, claws down while falling.
    const CRAB_UP = [
      "3...........3",
      "33.........33",
      ".3..2...2..3.",
      ".3..1...1..3.",
      "..111111111..",
      ".11111111111.",
      ".11111111111.",
      "..1.1...1.1..",
      ".1..1...1..1.",
    ];
    const CRAB_DOWN = [
      ".............",
      "....2...2....",
      "....1...1....",
      "..111111111..",
      "33111111111.3",
      "3.111111111.3",
      "33.1.1.1.1.33",
      "..1..1.1..1..",
      ".1.........1.",
    ];
    const SHELL = "#d98263", CLAW = "#c2674a", EYE = "#1d1a16";

    let W = 320, H = 240, S = 1;        // S scales the 240px-high reference world
    let state = "ready";               // ready | playing | dead
    let crab = { y: 0, home: 0, vy: 0, flapT: 0 };
    let pipes = [], bubbles = [], groundX = 0, score = 0, best = load("best", 0), newBest = false;
    let deadAt = 0, last = 0, rafId = 0, spawnIn = 0;
    let colors = {};

    const G = 900, FLAP = -270, SPEED = 88, GAP = 76, PIPE_W = 32, SPACING = 150, GROUND = 18;
    const CRAB_X = () => W * .28;

    function readColors() {
      colors = { bg: cssVar("--bg"), pipe: cssVar("--ok"), lip: cssVar("--line"), sand: cssVar("--panel"), line: cssVar("--line"), text: cssVar("--text"), muted: cssVar("--muted"), accent: cssVar("--accent") };
    }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = stage.clientWidth; H = stage.clientHeight;
      S = H / 240;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      // The first resize can come before layout (0x0), so a waiting crab
      // is re-homed whenever the real height arrives.
      if (state === "ready" && !pipes.length) crab.home = crab.y = H * .45;
      if (state !== "playing") draw();
    }

    function reset() {
      crab = { y: H * .45, home: H * .45, vy: 0, flapT: 0 };
      pipes = []; score = 0; newBest = false; spawnIn = 0.6;
      if (!bubbles.length) for (let i = 0; i < 7; i++) bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2, v: 8 + Math.random() * 14 });
    }

    function flap() {
      if (state === "dead") {
        // A short lock so the tap that killed the crab does not restart.
        if (performance.now() - deadAt < 500) return;
        reset(); state = "ready";
      }
      if (state === "ready") { state = "playing"; last = performance.now(); loop(); }
      crab.vy = FLAP * S;
      crab.flapT = .16;
    }

    function spawnPipe() {
      const margin = 26 * S;
      const gap = GAP * S;
      const top = margin + Math.random() * (H - GROUND * S - gap - margin * 2);
      pipes.push({ x: W + 4, top, gap, passed: false });
    }

    function update(dt) {
      crab.vy += G * S * dt;
      crab.y += crab.vy * dt;
      crab.flapT = Math.max(0, crab.flapT - dt);
      const speed = SPEED * S * (1 + Math.min(score, 30) * .01);
      groundX = (groundX + speed * dt) % (12 * S);
      spawnIn -= dt;
      if (spawnIn <= 0) { spawnPipe(); spawnIn = (SPACING * S) / speed; }
      pipes.forEach((p) => { p.x -= speed * dt; });
      pipes = pipes.filter((p) => p.x > -PIPE_W * S - 4);
      bubbles.forEach((b) => { b.y -= b.v * S * dt; if (b.y < -4) { b.y = H + 4; b.x = Math.random() * W; } });

      const px = 2 * S, cw = 13 * px, ch = 9 * px;
      const cx = CRAB_X() - cw / 2, cy = crab.y - ch / 2;
      // Hitbox a little smaller than the sprite: clipping a claw tip by
      // one pixel feels unfair.
      const hx = cx + px, hy = cy + px, hw = cw - 2 * px, hh = ch - 2 * px;
      if (cy + ch >= H - GROUND * S) return die();
      if (cy < -ch) crab.y = -ch / 2;
      for (const p of pipes) {
        const pw = PIPE_W * S;
        if (hx + hw > p.x && hx < p.x + pw && (hy < p.top || hy + hh > p.top + p.gap)) return die();
        if (!p.passed && p.x + pw < hx) {
          p.passed = true; score += 1;
          if (score > best) { best = score; newBest = true; save("best", best); }
        }
      }
    }

    function die() { state = "dead"; deadAt = performance.now(); draw(); }

    function drawCrab() {
      const px = Math.max(1, Math.round(2 * S));
      const sprite = crab.flapT > 0 || state === "ready" && Math.floor(performance.now() / 400) % 2 ? CRAB_UP : CRAB_DOWN;
      const x0 = Math.round(CRAB_X() - 13 * px / 2), y0 = Math.round(crab.y - 9 * px / 2);
      for (let y = 0; y < 9; y++) for (let x = 0; x < 13; x++) {
        const ch = sprite[y][x];
        if (ch === ".") continue;
        ctx.fillStyle = ch === "1" ? SHELL : ch === "2" ? EYE : CLAW;
        ctx.fillRect(x0 + x * px, y0 + y * px, px, px);
      }
    }

    function text(str, y, size, color, weight) {
      ctx.font = (weight || 700) + " " + Math.round(size * S) + "px -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.fillText(str, W / 2, y);
    }

    function draw() {
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = colors.line;
      bubbles.forEach((b) => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * S, 0, Math.PI * 2); ctx.fill(); });
      const pw = PIPE_W * S, lip = 5 * S;
      pipes.forEach((p) => {
        ctx.fillStyle = colors.pipe;
        ctx.fillRect(p.x, 0, pw, p.top);
        ctx.fillRect(p.x, p.top + p.gap, pw, H - p.top - p.gap);
        ctx.fillStyle = colors.lip;
        ctx.fillRect(p.x - 2 * S, p.top - lip, pw + 4 * S, lip);
        ctx.fillRect(p.x - 2 * S, p.top + p.gap, pw + 4 * S, lip);
      });
      const gy = H - GROUND * S;
      ctx.fillStyle = colors.sand;
      ctx.fillRect(0, gy, W, GROUND * S);
      ctx.fillStyle = colors.line;
      ctx.fillRect(0, gy, W, Math.max(1, S));
      for (let x = -groundX; x < W; x += 12 * S) ctx.fillRect(x, gy + 7 * S, 5 * S, Math.max(1, S));
      drawCrab();

      if (state === "playing") {
        text(String(score), 24 * S, 26, colors.text, 800);
      } else if (state === "ready") {
        text(t("title"), H * .2, 20, colors.text, 800);
        text(t("tapToFly"), H * .68, 12, colors.accent, 700);
        if (best) text(t("best", { n: best }), H * .68 + 17 * S, 10, colors.muted, 600);
      } else {
        text(t("over"), H * .2, 20, colors.text, 800);
        text(newBest ? t("newBest") : t("score", { n: score }), H * .2 + 22 * S, 12, newBest ? colors.accent : colors.text, 700);
        if (newBest) text(t("score", { n: score }), H * .2 + 38 * S, 10, colors.muted, 600);
        else text(t("best", { n: best }), H * .2 + 38 * S, 10, colors.muted, 600);
        text(t("again"), H * .68, 12, colors.accent, 700);
      }
    }

    function loop() {
      if (rafId) return;
      const tick = (now) => {
        rafId = 0;
        if (document.hidden) return;
        const dt = Math.min(.05, (now - last) / 1000);
        last = now;
        if (state === "playing") update(dt);
        else if (state === "ready") crab.y = crab.home + Math.sin(now / 320) * 4 * S;
        draw();
        // Ready screen keeps a slow idle animation (bobbing crab); dead
        // screen is static, so the loop stops there to spare the CPU.
        if (state === "playing" || state === "ready") rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    stage.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      event.preventDefault();
      flap();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "ArrowUp") { event.preventDefault(); flap(); }
    });
    // Pausing a flappy game mid-air is a death sentence, so hiding the app
    // just freezes the frame and resumes from "ready" at the same height.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state === "playing") { state = "ready"; crab.vy = 0; crab.home = crab.y; }
      if (!document.hidden) { last = performance.now(); loop(); }
    });
    window.addEventListener("resize", resize);

    function onLang() { draw(); }
    function onTheme() { readColors(); draw(); }

    readColors();
    fillIcons();
    resize();
    reset();
    applyI18n();
    last = performance.now();
    loop();
  </script>
</body>
</html>
