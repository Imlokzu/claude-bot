<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>YouTube</title>
<style>
  /* Palette shared with device-settings (tuned to the bot). The light theme
     matters: the parent sends it in botSkin with the skin, and without this
     block the app stayed DARK on a light screen — with currentColor icons
     turning light on light. */
  :root {
    --bg: #16181a; --panel: #1e2124; --line: #2f3438;
    --text: #e8e4dc; --muted: #8e9498; --accent: #d17a58;
    --ok: #8ca879; --off: #6b7175;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #efe7d9; --panel: #fbf6ec; --line: #ddcdb2;
    --text: #2f271f; --muted: #7d6d5c; --accent: #b95f3d;
    --ok: #6f8b5f; --off: #a8998a;
    color-scheme: light;
  }

  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg, #16181a); color: var(--text, #e8e4dc);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 6px 8px 4px; gap: 5px; box-sizing: border-box; }
  .bar { display: flex; gap: 5px; flex: none; }
  input { flex: 1; min-width: 0; height: 28px; padding: 0 9px;
    border: 1px solid var(--line, #2f3438); border-radius: 14px;
    background: var(--panel, #1e2124); color: var(--text, #e8e4dc);
    font-size: 13px; outline: none; }
  input:focus { border-color: var(--accent, #d17a58); }
  /* Only .bar and .ctl buttons. While this rule sat on ALL buttons, the
     height also hit result cards (.card is a button too): a card with a
     preview needs ~126px, it got 30 — and each card covered the previous. */
  .bar button { background: var(--panel, #1e2124); color: var(--text, #e8e4dc);
    border: 1px solid var(--line, #2f3438); border-radius: 14px;
    height: 28px; padding: 0 11px; font-size: 12px; flex: none; cursor: pointer; }
  .bar button:active { background: var(--accent, #d17a58); }
  /* Square cog: next to "Search" on 320px every extra pixel of width comes
     out of the search field. */
  .bar button.icon { padding: 0; width: 28px; }

  /* Own vector icons in the screen's style: viewBox 24x24, stroke-only
     currentColor, no fill (same contract as static/screen/icons.js). Kept in
     the package, not imported: a package must stay self-contained. */
  svg { width: 14px; height: 14px; flex: none; fill: none;
    stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .bar button.icon svg { width: 15px; height: 15px; }
  .ctl button svg { width: 13px; height: 13px; display: block; margin: 0 auto; }
  .ib { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }

  /* Mode row + status. The mode is REMEMBERED, so a tap on a card plays at
     once — no second question about how. */
  .row2 { display: flex; align-items: center; gap: 6px; flex: none; min-height: 20px; }
  .seg { display: flex; flex: none; border: 1px solid var(--line, #2f3438);
    border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted, #8e9498);
    border: none; height: 20px; padding: 0 8px; font-size: 10px; cursor: pointer; }
  .seg button.on { background: var(--accent, #d17a58); color: var(--bg, #16181a); font-weight: 600; }
  .status { flex: 1; min-width: 0; font-size: 10px; color: var(--muted, #8e9498);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.now { color: var(--accent, #d17a58); }

  /* Two columns like YouTube: one column gives a 300x169 preview on 320px,
     one result per screen, and search turns into scrolling. */
  .grid { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 7px;
    align-content: start; padding: 4px 0 6px;
    border-top: 1px solid var(--line, #2f3438); scrollbar-width: none; }
  .grid::-webkit-scrollbar { display: none; }
  .shelf { grid-column: 1 / -1; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted, #8e9498); padding-top: 2px; }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
  .chips button { background: var(--panel, #1e2124); color: var(--text, #e8e4dc);
    border: 1px solid var(--line, #2f3438); border-radius: 11px;
    min-height: 24px; padding: 0 9px; font-size: 10px; cursor: pointer; max-width: 140px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card { display: flex; flex-direction: column; gap: 3px; width: 100%;
    padding: 0; border: none; background: transparent; text-align: left;
    color: var(--text, #e8e4dc); cursor: pointer; position: relative; }
  .card:active .thumb { border-color: var(--accent, #d17a58); }
  .card:disabled { opacity: 0.5; }
  /* aspect-ratio, not a fixed height: the card width follows the grid and
     the preview must stay 16:9, or people get stretched. */
  .thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 5px;
    object-fit: cover; display: block; background: var(--line, #2f3438);
    border: 1px solid transparent; }
  /* Resume bar under a continue-watching preview; scaleX, never width. */
  .resume { position: absolute; left: 1px; right: 1px; top: 0; aspect-ratio: 16 / 9;
    pointer-events: none; display: flex; align-items: flex-end; }
  .resume i { display: block; height: 3px; width: 100%; background: var(--accent, #d17a58);
    transform-origin: left center; border-radius: 0 0 0 5px; }
  .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 10.5px; line-height: 1.22; font-weight: 600; }
  .s { font-size: 9px; color: var(--muted, #8e9498);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* A live stream has no muxed track, so say so NOW rather than after a
     tap into silence. The dot is CSS: a glyph sits off the baseline. */
  .live { color: var(--accent, #d17a58); font-weight: 600; }
  .live::before { content: ""; display: inline-block; width: 5px; height: 5px;
    margin-right: 3px; border-radius: 50%; background: currentColor;
    vertical-align: 1px; }

  .hint { grid-column: 1 / -1; padding: 6px 2px; font-size: 10.5px;
    line-height: 1.45; color: var(--muted, #8e9498); }
  .hint b { color: var(--text, #e8e4dc); }

  /* ---- Video mode: the player takes the whole app ---- */
  .player { position: absolute; inset: 0; display: none;
    flex-direction: column; background: var(--panel, #1e2124); }
  .player.on { display: flex; }
  .ptop { flex: none; display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 6px; background: var(--panel, #1e2124); }
  .ptitle { flex: 1; min-width: 0; font-size: 10px; color: var(--text, #e8e4dc);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbox { flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: #000; position: relative; }
  video { width: 100%; max-height: 100%; background: #000; display: block; }
  /* Captions: one line block over the bottom of the frame. Only opacity
     changes; the text swaps in place, so nothing reflows the video. */
  .cap { position: absolute; left: 8px; right: 8px; bottom: 6px; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .15s linear; }
  .cap.on { opacity: 1; }
  .cap span { display: inline; padding: 1px 5px; border-radius: 3px;
    background: rgba(0, 0, 0, .72); color: #fff; font-size: 11px; line-height: 1.5;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .ctl { flex: none; display: flex; align-items: center; gap: 4px;
    height: 30px; padding: 0 5px; background: var(--panel, #1e2124); }
  .ctl button { background: transparent; color: var(--text, #e8e4dc);
    border: 1px solid var(--line, #2f3438); border-radius: 9px;
    height: 24px; min-width: 24px; padding: 0 4px; font-size: 10px; cursor: pointer; }
  .ctl button.on { border-color: var(--accent, #d17a58); color: var(--accent, #d17a58); }
  .ctl button:active { background: var(--accent, #d17a58); color: var(--bg, #16181a); }
  .seek { flex: 1; min-width: 0; height: 16px; position: relative; cursor: pointer; }
  .seek i { position: absolute; left: 0; right: 0; top: 7px; height: 3px;
    border-radius: 2px; background: var(--line, #2f3438); display: block; }
  /* transform: scaleX only. width on every frame is a reflow, and on an A53
     the player and decoder have already taken everything there was. */
  .seek b { position: absolute; left: 0; top: 7px; height: 3px; width: 100%;
    border-radius: 2px; background: var(--accent, #d17a58); display: block;
    transform: scaleX(0); transform-origin: left center; }
  /* Sponsor marks on the bar: you see IN ADVANCE where the player will
     jump, so a skip does not read as a broken stream. */
  .seek .ad { position: absolute; top: 6px; height: 5px; border-radius: 1px;
    background: var(--off, #6b5330); opacity: 0.85; }
  .time { flex: none; font-size: 9px; color: var(--muted, #8e9498);
    font-variant-numeric: tabular-nums; }
  .vmsg { position: absolute; inset: 26px 0 30px; display: none;
    align-items: center; justify-content: center; padding: 0 18px;
    text-align: center; font-size: 11px; line-height: 1.45;
    color: var(--muted, #8e9498); }
  .vmsg.on { display: flex; }

  /* "Skipped" pill: opacity only, no reflow, does not catch taps. */
  .skipped { position: absolute; left: 6px; bottom: 36px; max-width: 260px;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 9px; pointer-events: none;
    background: var(--panel, #1e2124); border: 1px solid var(--line, #2f3438);
    color: var(--text, #e8e4dc); font-size: 10px; line-height: 1.3;
    opacity: 0; transition: opacity 0.18s linear; }
  .skipped.on { opacity: 1; }

  /* ---- Sheets (settings, transcript) over the whole app ---- */
  .sheet { position: absolute; inset: 0; display: none; flex-direction: column;
    background: var(--bg, #16181a); }
  .sheet.on { display: flex; }
  .shead { flex: none; display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 6px; background: var(--panel, #1e2124); }
  .shead .ptitle { font-size: 11px; font-weight: 600; }
  .shead button, .ptop button { background: transparent; color: var(--text, #e8e4dc);
    border: 1px solid var(--line, #2f3438); border-radius: 9px;
    height: 22px; padding: 0 8px; font-size: 10px; cursor: pointer; }
  .sbody { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y;
    padding: 7px 9px 10px; scrollbar-width: none; }
  .sbody::-webkit-scrollbar { display: none; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--line, #2f3438); }
  .opt .txt { flex: 1; min-width: 0; }
  .opt .n { font-size: 11px; font-weight: 600; }
  .opt .d { font-size: 9px; line-height: 1.35; color: var(--muted, #8e9498); }
  /* A 40x22 switch is the smallest a finger hits on a resistive panel. */
  .sw { flex: none; width: 40px; height: 22px; border-radius: 11px; padding: 0;
    border: 1px solid var(--line, #2f3438); background: var(--panel, #1e2124);
    position: relative; cursor: pointer; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted, #8e9498);
    transform: translateX(0); transition: transform 0.16s ease-out; }
  .sw.on { border-color: var(--accent, #d17a58); }
  .sw.on::after { background: var(--accent, #d17a58); transform: translateX(18px); }
  .cats { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 0 2px; }
  .cats button { background: var(--panel, #1e2124); color: var(--muted, #8e9498);
    border: 1px solid var(--line, #2f3438); border-radius: 11px;
    min-height: 22px; padding: 2px 9px; font-size: 9.5px; cursor: pointer; }
  .cats button.on { background: var(--accent, #d17a58); color: var(--bg, #16181a);
    border-color: var(--accent, #d17a58); font-weight: 600; }
  .cats.off { opacity: 0.4; }
  .note { padding: 8px 0 2px; font-size: 9px; line-height: 1.45;
    color: var(--muted, #8e9498); }
  .note b { color: var(--text, #e8e4dc); }
  /* Transcript lines: tap to jump. The current line is marked by colour
     only, so following along costs no layout. */
  .line { display: flex; gap: 7px; width: 100%; padding: 5px 2px; border: none;
    border-bottom: 1px solid var(--line, #2f3438); background: transparent;
    color: var(--text, #e8e4dc); text-align: left; font-size: 10.5px; line-height: 1.35; cursor: pointer; }
  .line .ts { flex: none; width: 34px; color: var(--muted, #8e9498); font-variant-numeric: tabular-nums; }
  .line.now { color: var(--accent, #d17a58); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <input id="q" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
    <button id="go" type="button" data-i18n="search.go"></button>
    <button id="cog" class="icon" type="button" data-i18n-aria="settings.aria" data-icon="settings"></button>
  </div>
  <div class="row2">
    <div class="seg" id="mode" role="group" data-i18n-aria="mode.aria">
      <button type="button" class="ib" data-mode="video"><span class="i" data-icon="play"></span><span data-i18n="mode.video"></span></button>
      <button type="button" class="ib" data-mode="audio"><span class="i" data-icon="music"></span><span data-i18n="mode.audio"></span></button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="player" id="player">
  <div class="ptop">
    <button class="pback ib" id="pback" type="button"><span class="i" data-icon="back"></span><span data-i18n="common.back"></span></button>
    <div class="ptitle" id="ptitle"></div>
  </div>
  <div class="vbox">
    <video id="v" playsinline preload="metadata"></video>
    <div class="cap" id="cap"><span id="capText"></span></div>
  </div>
  <div class="vmsg" id="vmsg"></div>
  <div class="skipped" id="skipped"></div>
  <div class="ctl">
    <!-- The step is SYMMETRIC: 10 back, 10 forward. An asymmetric pair looks
         identical and does different things. -->
    <button id="seekBack" type="button" data-i18n-aria="player.back10" data-icon="rewind"></button>
    <button id="pp" type="button" data-i18n-aria="player.playPause"></button>
    <button id="seekFwd" type="button" data-i18n-aria="player.fwd10" data-icon="forward"></button>
    <div class="seek" id="seek"><i></i><b id="seekfill"></b></div>
    <div class="time" id="time">0:00</div>
    <button id="cc" type="button" data-i18n="player.cc" data-i18n-aria="player.ccAria"></button>
    <button id="lines" type="button" data-i18n-aria="player.linesAria" data-icon="list"></button>
    <button id="rate" type="button" data-i18n-aria="player.rate">1x</button>
  </div>
</div>

<div class="sheet" id="transcript">
  <div class="shead">
    <button id="tback" class="ib" type="button"><span class="i" data-icon="back"></span><span data-i18n="common.back"></span></button>
    <div class="ptitle" data-i18n="transcript.head"></div>
  </div>
  <div class="sbody" id="tbody"></div>
</div>

<div class="sheet" id="sheet">
  <div class="shead">
    <button id="sback" class="ib" type="button"><span class="i" data-icon="back"></span><span data-i18n="common.back"></span></button>
    <div class="ptitle" data-i18n="settings.head"></div>
  </div>
  <div class="sbody">
    <div class="opt">
      <div class="txt">
        <div class="n" data-i18n="settings.sponsor"></div>
        <div class="d" data-i18n="settings.sponsorHint"></div>
      </div>
      <button class="sw" id="swSponsor" type="button" role="switch" data-i18n-aria="settings.sponsor"></button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="opt">
      <div class="txt">
        <div class="n" data-i18n="settings.notify"></div>
        <div class="d" data-i18n="settings.notifyHint"></div>
      </div>
      <button class="sw" id="swNotify" type="button" role="switch" data-i18n-aria="settings.notify"></button>
    </div>
    <div class="opt">
      <div class="txt">
        <div class="n" data-i18n="settings.thumbs"></div>
        <div class="d" data-i18n="settings.thumbsHint"></div>
      </div>
      <button class="sw" id="swThumbs" type="button" role="switch" data-i18n-aria="settings.thumbs"></button>
    </div>
    <div class="opt">
      <div class="txt">
        <div class="n" data-i18n="settings.captions"></div>
        <div class="d" data-i18n="settings.captionsHint"></div>
      </div>
      <button class="sw" id="swCaptions" type="button" role="switch" data-i18n-aria="settings.captions"></button>
    </div>
    <div class="opt">
      <div class="txt">
        <div class="n" data-i18n="settings.history"></div>
        <div class="d" data-i18n="settings.historyHint"></div>
      </div>
      <button class="sw" id="clearHistory" type="button" data-i18n-aria="settings.history"></button>
    </div>
    <div class="note" data-i18n-html="settings.note"></div>
  </div>
</div>
<script>
  // YouTube client for the 320x240 screen.
  //   search     -> /api/music/search (yt-dlp on the backend, no keys)
  //   audio      -> /api/music/play: SSE to the bot, plays in Now Playing
  //   video      -> /api/music/video: muxed mp4 straight into <video>
  //   sponsors   -> /api/video/segments: SponsorBlock segments to jump over
  //   captions   -> /api/music/transcript: segments shown over the video
  //   bot        -> postMessage {type:"botVideo"} from the parent
  //   state      -> POST /api/video/state, so the bot knows where we are
  const $ = (id) => document.getElementById(id);

  /* ---------- i18n ---------- */

  const STR = {
    uk: {
      "search.placeholder": "Що шукати на YouTube?",
      "search.aria": "Пошук",
      "search.go": "Шукати",
      "settings.aria": "Налаштування",
      "mode.aria": "Режим відтворення",
      "mode.video": "Відео",
      "mode.audio": "Звук",
      "common.back": "Назад",
      "status.idle": "Пошук по YouTube.",
      "status.searching": "Шукаю «{q}»…",
      "status.found": "Знайдено: {n}. Тап — {what}.",
      "status.watch": "дивитись",
      "status.listen": "слухати",
      "status.nothing": "Нічого не знайшлось.",
      "status.searchDown": "Пошук недоступний.",
      "status.offline": "Бот недоступний.",
      "status.live": "Прямий ефір поки не граємо — тільки записи.",
      "status.starting": "Вмикаю: {title}",
      "status.playing": "Грає в Now Playing угорі: {title}",
      "status.failed": "Не вийшло: {error}",
      "status.ads": "Знайдено вклеєної реклами: {time}",
      "home.hint": "Два режими. <b>Відео</b> — грає тут, з картинкою. <b>Звук</b> — іде в <b>Now Playing</b> угорі екрана й не спиняється, коли застосунок закрито. Вклеєну рекламу плеєр пропускає сам.",
      "home.continue": "Продовжити перегляд",
      "home.recent": "Нещодавні пошуки",
      "card.live": "ЕФІР",
      "player.back10": "Назад на 10 секунд",
      "player.fwd10": "Вперед на 10 секунд",
      "player.playPause": "Пуск або пауза",
      "player.rate": "Швидкість",
      "player.cc": "CC",
      "player.ccAria": "Субтитри",
      "player.linesAria": "Текст відео",
      "player.untitled": "Відео",
      "player.preparing": "Готую відео… перше з'єднання — кілька секунд.",
      "player.tapToPlay": "Тапни кнопку пуску, щоб почати.",
      "player.tapToResume": "Тапни кнопку пуску, щоб продовжити.",
      "player.buffering": "Буферизую…",
      "player.error": "Відео не пішло. Спробуй режим «Звук» — він іде іншим шляхом.",
      "player.startFailed": "Не вдалося запустити.",
      "player.skipped": "{label} — {time}",
      "player.ad": "реклама",
      "transcript.head": "Текст відео",
      "transcript.loading": "Завантажую субтитри…",
      "transcript.none": "Субтитрів немає: {error}",
      "settings.head": "Відео і реклама",
      "settings.sponsor": "Пропускати вклеєну рекламу",
      "settings.sponsorHint": "База SponsorBlock. Запит іде хешем — сервер не бачить, що саме ти дивишся.",
      "settings.notify": "Казати, що пропустив",
      "settings.notifyHint": "Плашка на пару секунд — щоб стрибок не виглядав як збій.",
      "settings.thumbs": "Превʼю через бота",
      "settings.thumbsHint": "Картинки тягне бот, а не пристрій напряму з Google.",
      "settings.captions": "Субтитри одразу",
      "settings.captionsHint": "Вмикати CC для кожного нового відео.",
      "settings.history": "Забути історію",
      "settings.historyHint": "Прибрати «Продовжити перегляд» і нещодавні пошуки з цього пристрою.",
      "settings.note": "Рекламу, яку вставляє <b>сам YouTube</b>, тут не видно взагалі: відео йде потоком через бота, без плеєра YouTube. Ці перемикачі — про рекламу, <b>вклеєну в саме відео</b>.",
    },
    en: {
      "search.placeholder": "Search YouTube",
      "search.aria": "Search",
      "search.go": "Search",
      "settings.aria": "Settings",
      "mode.aria": "Playback mode",
      "mode.video": "Video",

      "settings.note": "Ads inserted by <b>YouTube itself</b> never show here: video streams through the bot, without YouTube's player. These switches are about sponsor segments <b>baked into the video</b>.",
    },
  };

  function storageGet(key, fallback) {
    // Storage throws in a sandbox and in private mode; the app keeps working.
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* memory only */ }
  }

  let lang = storageGet("botScreenLang", "uk") === "en" ? "en" : "uk";
  function t(key, vars) {
    let text = (STR[lang] && STR[lang][key]) || STR.uk[key] || key;
    if (vars) for (const k in vars) text = text.split("{" + k + "}").join(String(vars[k]));
    return text;
  }
  // HTML only from our own dictionary, never from data: values are escaped.
  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
    for (const el of document.querySelectorAll("[data-i18n-placeholder]")) el.placeholder = t(el.dataset.i18nPlaceholder);
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  }

  /* ---------- icons ---------- */

  const ICONS = {
    // Copied VERBATIM from static/screen/icons.js (play, pause, next,
    // settings, music, list) so the screen never shows two near-identical
    // versions of one icon. "back" follows device-settings.
    play:     '<path d="M8 5.4v13.2L19.2 12z"/>',
    pause:    '<path d="M8.6 5.5v13M15.4 5.5v13"/>',
    skip:     '<path d="M6.5 5.5v13L15.8 12z"/><path d="M17.5 5.5v13"/>',
    settings: '<path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/>' +
              '<circle cx="12" cy="12" r="4.2"/>',
    music:    '<path d="M9.2 18V6.2l9.3-2v11.6"/>' +
              '<circle cx="6.9" cy="18" r="2.4"/>' +
              '<circle cx="16.2" cy="15.8" r="2.4"/>',
    list:     '<path d="M4 6.5h.01M4 12h.01M4 17.5h.01M8.5 6.5h11.5M8.5 12h11.5M8.5 17.5h11.5"/>',
    back:     '<path d="m14 5-7 7 7 7M7 12h13"/>',
    // Mirrored double triangles, scaled from play (y 6.6..17.4) so the three
    // transport icons read the same size in a row.
    rewind:   '<path d="M11.5 6.6 5 12l6.5 5.4z"/><path d="M19 6.6 12.5 12l6.5 5.4z"/>',
    forward:  '<path d="M12.5 6.6 19 12l-6.5 5.4z"/><path d="M5 6.6 11.5 12 5 17.4z"/>',
  };

  function iconSvg(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.play) + "</svg>";
  }
  function paintIcons(root) {
    for (const el of (root || document).querySelectorAll("[data-icon]")) el.innerHTML = iconSvg(el.dataset.icon);
  }

  const q = $("q"), go = $("go"), grid = $("grid"), status = $("status");
  const player = $("player"), video = $("v"), vmsg = $("vmsg"), sheet = $("sheet");
  const KEY = "youtube.lastQuery";
  const MODE_KEY = "youtube.mode";
  const HISTORY_KEY = "youtube.history";
  const SEARCHES_KEY = "youtube.searches";
  const CAPTIONS_KEY = "youtube.captions";
  const RATES = [1, 1.25, 1.5, 1.75, 2];

  let mode = "video";
  let rateIdx = 0;
  let seekRaf = false;
  let current = null;          // track in the player
  let settings = null;         // backend settings (sponsors, previews)
  let catalog = {};            // SponsorBlock category names
  let adSegments = [];         // segments to skip in this video
  let skippedCount = 0, skippedSeconds = 0;
  let skipTimer = 0, stateTimer = 0;
  let lastTracks = [];
  let statusKey = ["status.idle", null, false];

  function fmt(sec) {
    // An hour-long video used to read "100:50" — true, and nonsense to the eye.
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    const s = sec % 60, m = Math.floor(sec / 60) % 60, h = Math.floor(sec / 3600);
    const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
    return h ? h + ":" + mm + ":" + ss : m + ":" + ss;
  }
  // The status line remembers its key, so a language switch re-renders it.
  function say(key, vars, now) {
    statusKey = [key, vars || null, !!now];
    status.textContent = t(key, vars);
    status.className = "status" + (now ? " now" : "");
  }
  /* FastAPI sends detail as a LIST of objects for invalid params; string
     concatenation printed "[object Object]" into the status line. */
  function detailText(payload, fallback) {
    const d = payload && payload.detail;
    if (typeof d === "string" && d) return d;
    if (d && typeof d.message === "string") return d.message;
    if (Array.isArray(d) && d.length && d[0] && d[0].msg) return String(d[0].msg);
    return fallback;
  }

  /* ---------- local history: continue watching + recent searches ----------
     On the device, not the backend: this is what one screen watched, and the
     bot has no business keeping a watch log. */

  function readList(key) {
    try { const v = JSON.parse(storageGet(key, "[]")); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function writeList(key, list) { storageSet(key, JSON.stringify(list)); }

  function rememberSearch(query) {
    const list = readList(SEARCHES_KEY).filter((x) => x !== query);
    list.unshift(query);
    writeList(SEARCHES_KEY, list.slice(0, 6));
  }

  function rememberWatch(track, position, duration) {
    if (!track || !track.id) return;
    const list = readList(HISTORY_KEY).filter((x) => x.id !== track.id);
    // Within 20 s of either end there is nothing to "continue".
    const pos = Number(position) || 0, total = Number(duration) || 0;
    const finished = total && pos > total - 20;
    list.unshift({
      id: track.id, title: track.title || "", uploader: track.uploader || "",
      duration: total || track.duration || 0, thumb: track.thumb || "",
      position: finished || pos < 20 ? 0 : Math.floor(pos),
    });
    writeList(HISTORY_KEY, list.slice(0, 8));
  }

  function renderHome() {
    lastTracks = [];
    grid.innerHTML = "";
    const history = readList(HISTORY_KEY).filter((x) => x.position > 0);
    if (history.length) {
      grid.appendChild(shelf("home.continue"));
      for (const item of history.slice(0, 4)) grid.appendChild(card(item));
    }
    const searches = readList(SEARCHES_KEY);
    if (searches.length) {
      grid.appendChild(shelf("home.recent"));
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const query of searches) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.textContent = query;
        chip.addEventListener("click", () => { q.value = query; search(); });
        chips.appendChild(chip);
      }
      grid.appendChild(chips);
    }
    if (!history.length && !searches.length) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.innerHTML = t("home.hint");
      grid.appendChild(hint);
    }
    say("status.idle");
  }

  function shelf(key) {
    const el = document.createElement("div");
    el.className = "shelf";
    el.textContent = t(key);
    return el;
  }

  /* ---------- settings (shared with the bot) ----------
     On the backend, not in localStorage: otherwise the switch here and the
     phrase "turn off ad skipping" would live separate lives. */

  async function loadSettings() {
    try {
      const r = await fetch("/api/video/settings", { cache: "no-store" });
      const d = await r.json();
      settings = d.settings || null;
      catalog = d.categories || {};
    } catch (e) {
      settings = settings || { sponsorblock: true, categories: ["sponsor"], proxy_thumbnails: true, notify_skips: true };
      catalog = catalog || {};
    }
    renderSettings();
  }

  async function patchSettings(patch) {
    // Draw AT ONCE; a switch that "thinks" for half a second reads as not pressed.
    settings = Object.assign({}, settings, patch);
    renderSettings();
    try {
      const r = await fetch("/api/video/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      const d = await r.json();
      if (d && d.settings) { settings = d.settings; renderSettings(); }
    } catch (e) { /* keep the optimistic state */ }
  }

  function setSwitch(id, on) {
    $(id).classList.toggle("on", !!on);
    $(id).setAttribute("aria-checked", String(!!on));
  }

  function renderSettings() {
    setSwitch("swCaptions", captionsDefault());
    if (!settings) return;
    setSwitch("swSponsor", settings.sponsorblock);
    setSwitch("swNotify", settings.notify_skips);
    setSwitch("swThumbs", settings.proxy_thumbnails);

    const box = $("cats");
    box.classList.toggle("off", !settings.sponsorblock);
    const active = new Set(settings.categories || []);
    box.innerHTML = "";
    for (const key of Object.keys(catalog)) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = catalog[key];
      b.className = active.has(key) ? "on" : "";
      b.addEventListener("click", () => {
        const next = new Set(settings.categories || []);
        if (next.has(key)) next.delete(key); else next.add(key);
        // No categories left = skip nothing, i.e. the same off switch, only
        // invisible — so turn it off explicitly.
        const list = Array.from(next);
        patchSettings(list.length ? { categories: list, sponsorblock: true } : { sponsorblock: false });
      });
      box.appendChild(b);
    }
  }

  $("swSponsor").addEventListener("click", () => {
    const on = !settings?.sponsorblock;
    const patch = { sponsorblock: on };
    if (on && !(settings?.categories || []).length) {
      patch.categories = ["sponsor", "selfpromo", "interaction", "music_offtopic"];
    }
    patchSettings(patch);
  });
  $("swNotify").addEventListener("click", () => patchSettings({ notify_skips: !settings?.notify_skips }));
  $("swThumbs").addEventListener("click", () => {
    patchSettings({ proxy_thumbnails: !settings?.proxy_thumbnails });
    if (lastTracks.length) render(lastTracks);
  });
  $("swCaptions").addEventListener("click", () => {
    storageSet(CAPTIONS_KEY, captionsDefault() ? "0" : "1");
    renderSettings();
  });
  $("clearHistory").addEventListener("click", () => {
    writeList(HISTORY_KEY, []);
    writeList(SEARCHES_KEY, []);
    storageSet(KEY, "");
    sheet.classList.remove("on");
    q.value = "";
    renderHome();
  });
  $("cog").addEventListener("click", () => {
    sheet.classList.add("on");
    // Re-read: the bot may have flipped a switch by voice meanwhile.
    loadSettings();
  });
  $("sback").addEventListener("click", () => { sheet.classList.remove("on"); });

  /* ---------- mode ---------- */

  function setMode(next) {
    mode = next === "audio" ? "audio" : "video";
    storageSet(MODE_KEY, mode);
    for (const b of $("mode").querySelectorAll("button")) b.classList.toggle("on", b.dataset.mode === mode);
  }
  $("mode").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-mode]");
    if (b) setMode(b.dataset.mode);
  });

  /* ---------- results ---------- */

  /* Previews through the bot (the device never talks to Google) or direct.
     The direct URL comes from the backend's search result; the package holds
     no Google address of its own. */
  function thumbUrl(item) {
    if (settings && settings.proxy_thumbnails === false && item.thumb) return item.thumb;
    return "/api/video/thumb?id=" + encodeURIComponent(item.id);
  }

  function card(item) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";

    const thumb = document.createElement("img");
    thumb.className = "thumb";
    thumb.loading = "lazy";
    thumb.alt = "";
    thumb.decoding = "async";
    thumb.src = thumbUrl(item);
    // No network: a grey 16:9 block stays, not a hole in the grid
    thumb.addEventListener("error", () => { thumb.removeAttribute("src"); }, { once: true });
    btn.appendChild(thumb);

    if (item.position && item.duration) {
      const bar = document.createElement("div");
      bar.className = "resume";
      const fill = document.createElement("i");
      fill.style.transform = "scaleX(" + Math.min(1, item.position / item.duration).toFixed(3) + ")";
      bar.appendChild(fill);
      btn.appendChild(bar);
    }

    const title = document.createElement("div");
    title.className = "t";
    title.textContent = item.title;

    const sub = document.createElement("div");
    sub.className = "s";
    if (item.live) {
      const live = document.createElement("span");
      live.className = "live";
      live.textContent = t("card.live");
      sub.appendChild(live);
      sub.appendChild(document.createTextNode(" · " + (item.uploader || "YouTube")));
    } else {
      sub.textContent = (item.uploader || "YouTube") + (item.duration ? " · " + fmt(item.duration) : "");
    }

    btn.appendChild(title);
    btn.appendChild(sub);
    btn.addEventListener("click", () => start(item, btn));
    return btn;
  }

  function render(tracks) {
    lastTracks = tracks;
    grid.innerHTML = "";
    if (!tracks.length) { say("status.nothing"); return; }
    for (const item of tracks) grid.appendChild(card(item));
    say("status.found", { n: tracks.length, what: t(mode === "video" ? "status.watch" : "status.listen") });
  }

  async function search() {
    const query = q.value.trim();
    if (!query) { renderHome(); return; }
    storageSet(KEY, query);
    rememberSearch(query);
    say("status.searching", { q: query });
    grid.innerHTML = "";
    go.disabled = true;
    try {
      // limit=8 is the endpoint's own ceiling; 10 returned 422.
      const r = await fetch("/api/music/search?q=" + encodeURIComponent(query) + "&limit=8");
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        status.textContent = detailText(err, t("status.searchDown"));
        return;
      }
      const d = await r.json();
      render(d.tracks || []);
    } catch (e) {
      say("status.offline");
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener("click", search);
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  q.addEventListener("search", () => { if (!q.value.trim()) renderHome(); });

  /* ---------- play in the chosen mode ---------- */

  function start(item, btn) {
    // A live stream has only HLS; say so now instead of "playing" and silence.
    if (item.live) { say("status.live"); return; }
    if (mode === "video") openVideo(item, item.position || 0);
    else playAudio(item, btn);
  }

  async function playAudio(item, btn) {
    if (btn) btn.disabled = true;
    say("status.starting", { title: item.title }, true);
    try {
      const r = await fetch("/api/music/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id, title: item.title, uploader: item.uploader || "", duration: item.duration || 0 }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        say("status.failed", { error: detailText(err, String(r.status)) });
      } else {
        say("status.playing", { title: item.title }, true);
      }
    } catch (e) {
      say("status.offline");
    }
    if (btn) btn.disabled = false;
  }

  /* ---------- the video player ---------- */

  /* The button shows what you CAN do. The truth is video.paused, not our
     intent: with autoplay blocked the player stays paused. */
  function setPlayIcon(playing) { $("pp").innerHTML = iconSvg(playing ? "pause" : "play"); }

  let vmsgKey = "";
  function vsay(key) {
    vmsgKey = key || "";
    vmsg.textContent = key ? t(key) : "";
    vmsg.classList.toggle("on", !!key);
  }

  async function openVideo(item, startAt) {
    // Same video already open: do not restart the stream — the first
    // connection costs seconds, and "show it again" would look like a hang.
    if (current && current.id === item.id && player.classList.contains("on")) {
      if (startAt) video.currentTime = startAt;
      if (video.paused) video.play().catch(() => {});
      return;
    }
    if (current) rememberWatch(current, video.currentTime, video.duration);
    current = item;
    sheet.classList.remove("on");
    $("transcript").classList.remove("on");
    $("ptitle").textContent = item.title || t("player.untitled");
    player.classList.add("on");
    // Now Playing and video are two sound sources; without this they would
    // play TOGETHER.
    try { await fetch("/api/music/stop", { method: "POST" }); } catch (e) { /* not critical */ }
    vsay("player.preparing");
    $("time").textContent = item.duration ? "0:00 / " + fmt(item.duration) : "0:00";
    setRate(0);
    // "Mute" was about THAT video; the next one starting silent looks broken.
    video.muted = false;
    resetSkips();
    resetCaptions();
    setPlayIcon(false);
    video.src = "/api/music/video?id=" + encodeURIComponent(item.id);
    if (startAt) {
      // currentTime before metadata is dropped by the browser
      video.addEventListener("loadedmetadata", () => { try { video.currentTime = startAt; } catch (e) {} }, { once: true });
    }
    loadSegments(item.id);
    if (captionsDefault()) setCaptions(true);
    // Report BEFORE the first frame: a player waiting for a tap otherwise
    // says nothing, and the bot describes the previous video as current.
    pushState();
    video.addEventListener("loadedmetadata", () => pushState(), { once: true });
    try {
      await video.play();
    } catch (e) {
      vsay("player.tapToPlay");
    }
  }

  function closeVideo() {
    if (current) rememberWatch(current, video.currentTime, video.duration);
    player.classList.remove("on");
    $("transcript").classList.remove("on");
    try { video.pause(); } catch (e) { /* already dead */ }
    // Empty src, not just pause: the proxied stream would keep pulling.
    video.removeAttribute("src");
    try { video.load(); } catch (e) { /* ignore */ }
    vsay("");
    current = null;
    resetSkips();
    resetCaptions();
    stopStateReports();
    pushState({ closed: true });
    if (!lastTracks.length) renderHome();
  }
  $("pback").addEventListener("click", closeVideo);

  video.addEventListener("playing", () => { vsay(""); setPlayIcon(true); startStateReports(); pushState(); });
  video.addEventListener("pause", () => {
    setPlayIcon(false);
    pushState();
    if (current) rememberWatch(current, video.currentTime, video.duration);
  });
  video.addEventListener("waiting", () => vsay("player.buffering"));
  video.addEventListener("ended", () => { setPlayIcon(false); pushState(); if (current) rememberWatch(current, 0, 0); });
  video.addEventListener("error", () => { if (video.getAttribute("src")) vsay("player.error"); });

  $("pp").addEventListener("click", () => {
    if (video.paused) video.play().catch(() => vsay("player.startFailed"));
    else video.pause();
  });

  /* The seek step equals the video_control tool default (SEEK_STEP_S <->
     DEFAULT_STEP_S), so "skip ahead" by voice and a tap do the same thing. */
  const SEEK_STEP_S = 10;
  function nudge(delta) {
    const total = video.duration;
    if (!(total > 0) || !isFinite(total)) return;
    video.currentTime = Math.min(total, Math.max(0, video.currentTime + delta));
    pushState();
  }
  $("seekBack").addEventListener("click", () => nudge(-SEEK_STEP_S));
  $("seekFwd").addEventListener("click", () => nudge(SEEK_STEP_S));

  /* Speed cycles on one button: five chips next to the transport on 320px
     are misses, not choices. */
  function setRate(idx) {
    rateIdx = ((idx % RATES.length) + RATES.length) % RATES.length;
    setRateValue(RATES[rateIdx]);
  }
  function setRateValue(value) {
    const rate = Number(value) || 1;
    const idx = RATES.indexOf(rate);
    if (idx >= 0) rateIdx = idx;
    // preservesPitch, or the host turns into a chipmunk at 2x
    video.preservesPitch = true;
    video.webkitPreservesPitch = true;
    video.playbackRate = rate;
    $("rate").textContent = String(rate) + "x";
  }
  $("rate").addEventListener("click", () => setRate(rateIdx + 1));

  video.addEventListener("timeupdate", () => {
    maybeSkip();
    updateCaption();
    if (seekRaf) return;
    seekRaf = true;
    requestAnimationFrame(() => {
      seekRaf = false;
      const total = video.duration > 0 && isFinite(video.duration) ? video.duration : 0;
      const part = total ? Math.min(1, video.currentTime / total) : 0;
      $("seekfill").style.transform = "scaleX(" + part.toFixed(4) + ")";
      $("time").textContent = fmt(video.currentTime) + (total ? " / " + fmt(total) : "");
    });
  });

  $("seek").addEventListener("click", (e) => {
    const total = video.duration;
    if (!(total > 0) || !isFinite(total)) return;
    const box = e.currentTarget.getBoundingClientRect();
    const part = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
    video.currentTime = part * total;
    pushState();
  });

  /* ---------- captions and transcript ----------
     Loaded once per video on first need and shared by the overlay and the
     transcript sheet. The backend picks the source (the youtube.com panel
     first), so this works even when YouTube's timedtext is blocked. */

  let captions = null;          // null = not loaded, [] = none
  let captionsError = "";
  let captionsFor = "";
  let captionsOn = false;
  let captionIdx = -1;

  function captionsDefault() { return storageGet(CAPTIONS_KEY, "0") === "1"; }

  function resetCaptions() {
    captions = null; captionsError = ""; captionsFor = ""; captionIdx = -1;
    setCaptions(false);
  }

  async function loadCaptions() {
    if (!current) return [];
    if (captions && captionsFor === current.id) return captions;
    const id = current.id;
    try {
      const r = await fetch("/api/music/transcript?id=" + encodeURIComponent(id) + "&lang=" + lang);
      const d = await r.json().catch(() => ({}));
      if (!current || current.id !== id) return [];
      if (!r.ok) { captions = []; captionsError = detailText(d, String(r.status)); }
      else { captions = (d.segments || []).filter((s) => s && s.text); captionsError = ""; }
    } catch (e) {
      captions = []; captionsError = t("status.offline");
    }
    captionsFor = id;
    return captions;
  }

  // Binary search: an hour of captions is ~1000 lines and timeupdate fires
  // four times a second on a Pi.
  function segmentAt(time) {
    if (!captions || !captions.length) return -1;
    let lo = 0, hi = captions.length - 1, best = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (captions[mid].start <= time) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return best;
  }

  function updateCaption() {
    const idx = segmentAt(video.currentTime + 0.2);
    if (idx === captionIdx) return;
    captionIdx = idx;
    if (captionsOn) {
      $("capText").textContent = idx >= 0 ? captions[idx].text : "";
      $("cap").classList.toggle("on", idx >= 0);
    }
    const sheetOpen = $("transcript").classList.contains("on");
    if (sheetOpen) markLine(idx, false);
  }

  async function setCaptions(on) {
    captionsOn = !!on;
    $("cc").classList.toggle("on", captionsOn);
    if (!captionsOn) { $("cap").classList.remove("on"); return; }
    await loadCaptions();
    if (!captions.length) {
      captionsOn = false;
      $("cc").classList.remove("on");
      if (captionsError) { vsay(""); vmsg.textContent = t("transcript.none", { error: captionsError }); vmsg.classList.add("on"); setTimeout(() => vsay(""), 3000); }
      return;
    }
    captionIdx = -1;
    updateCaption();
  }
  $("cc").addEventListener("click", () => setCaptions(!captionsOn));

  function markLine(idx, scroll) {
    const body = $("tbody");
    const prev = body.querySelector(".line.now");
    if (prev) prev.classList.remove("now");
    const el = idx >= 0 ? body.children[idx] : null;
    if (el) {
      el.classList.add("now");
      if (scroll) el.scrollIntoView({ block: "center" });
    }
  }

  async function openTranscript() {
    const body = $("tbody");
    $("transcript").classList.add("on");
    body.textContent = t("transcript.loading");
    await loadCaptions();
    body.innerHTML = "";
    if (!captions.length) {
      body.textContent = t("transcript.none", { error: captionsError || "—" });
      return;
    }
    const frag = document.createDocumentFragment();
    captions.forEach((seg) => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "line";
      const ts = document.createElement("span");
      ts.className = "ts";
      ts.textContent = fmt(seg.start);
      const text = document.createElement("span");
      text.textContent = seg.text;
      row.append(ts, text);
      row.addEventListener("click", () => {
        try { video.currentTime = seg.start; } catch (e) {}
        $("transcript").classList.remove("on");
        if (video.paused) video.play().catch(() => {});
        pushState();
      });
      frag.appendChild(row);
    });
    body.appendChild(frag);
    markLine(segmentAt(video.currentTime + 0.2), true);
  }
  $("lines").addEventListener("click", openTranscript);
  $("tback").addEventListener("click", () => $("transcript").classList.remove("on"));

  /* ---------- sponsor segments (SponsorBlock) ----------
     Ads YouTube inserts never reach us — the video is proxied without their
     player. What is left is sponsorship baked into the video, and only the
     community database knows its bounds. */

  function resetSkips() {
    adSegments = [];
    skippedCount = 0;
    skippedSeconds = 0;
    clearTimeout(skipTimer);
    $("skipped").classList.remove("on");
    for (const el of $("seek").querySelectorAll(".ad")) el.remove();
  }

  async function loadSegments(videoId) {
    try {
      const r = await fetch("/api/video/segments?id=" + encodeURIComponent(videoId));
      if (!r.ok) return;
      const d = await r.json();
      if (!current || current.id !== videoId) return;   // switched meanwhile
      adSegments = (d.segments || []).map((s) => ({ ...s, done: false }));
      if (adSegments.length) {
        say("status.ads", { time: fmt(d.skipped_seconds || 0) }, true);
        markSegments();
      }
    } catch (e) { /* not critical — play without skipping */ }
  }

  function markSegments() {
    const total = video.duration;
    if (!(total > 0) || !isFinite(total)) {
      video.addEventListener("loadedmetadata", markSegments, { once: true });
      return;
    }
    const bar = $("seek");
    for (const el of bar.querySelectorAll(".ad")) el.remove();
    for (const seg of adSegments) {
      const mark = document.createElement("span");
      mark.className = "ad";
      mark.style.left = (100 * seg.start / total).toFixed(2) + "%";
      mark.style.width = Math.max(0.8, 100 * (seg.end - seg.start) / total).toFixed(2) + "%";
      bar.appendChild(mark);
    }
  }

  function maybeSkip() {
    if (!adSegments.length || video.paused) return;
    const now = video.currentTime;
    for (const seg of adSegments) {
      // -0.4 near the end: a jump "to end" sometimes lands half a frame
      // short and the segment gets skipped twice in a row.
      if (seg.done || now < seg.start || now >= seg.end - 0.4) continue;
      seg.done = true;               // rewound by hand — don't fight the user
      const jumped = seg.end - now;
      try { video.currentTime = seg.end; } catch (e) { continue; }
      skippedCount += 1;
      skippedSeconds += Math.max(0, jumped);
      if (settings?.notify_skips !== false) {
        showSkipped(t("player.skipped", { label: seg.label || t("player.ad"), time: fmt(jumped) }));
      }
      pushState();
      return;                        // one jump per tick
    }
  }

  function showSkipped(text) {
    const box = $("skipped");
    box.innerHTML = iconSvg("skip") + "<span></span>";
    box.querySelector("span").textContent = text;
    box.classList.add("on");
    clearTimeout(skipTimer);
    skipTimer = setTimeout(() => box.classList.remove("on"), 2400);
  }

  /* ---------- state report to the bot ----------
     SSE only goes bot -> screen; without this the bot could only invent
     where we stopped. Sent on events and every 5 s while playing; the
     backend's 40 s TTL clears it if the screen sleeps. */

  function pushState(extra) {
    const payload = Object.assign({
      video_id: current ? current.id : "",
      title: current ? (current.title || "") : "",
      position: Number(video.currentTime) || 0,
      duration: (video.duration > 0 && isFinite(video.duration)) ? video.duration : (current?.duration || 0),
      paused: !!video.paused,
      muted: !!video.muted,
      rate: Number(video.playbackRate) || 1,
      skipped_count: skippedCount,
      skipped_seconds: Math.round(skippedSeconds * 10) / 10,
      segments: adSegments.length,
      captions: captionsOn,
    }, extra || {});
    fetch("/api/video/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  function startStateReports() {
    if (stateTimer) return;
    stateTimer = setInterval(() => {
      if (!player.classList.contains("on") || video.paused) return;
      pushState();
    }, 5000);
  }
  function stopStateReports() {
    clearInterval(stateTimer);
    stateTimer = 0;
  }

  /* ---------- commands from the bot ----------
     Arrive from the parent (screen.js) after an SSE video event. Unknown
     actions are ignored: a new tool on an old package must break nothing. */

  async function botCommand(cmd) {
    const action = String(cmd.action || "");
    if (action === "play") {
      const tr = cmd.track || {};
      if (!tr.id) return;
      setMode("video");
      sheet.classList.remove("on");
      await openVideo({
        id: tr.id,
        title: tr.title || t("player.untitled"),
        uploader: tr.uploader || "",
        duration: Number(tr.duration) || 0,
      }, Number(cmd.position) || 0);
      return;
    }
    if (!player.classList.contains("on")) return;
    const total = (video.duration > 0 && isFinite(video.duration)) ? video.duration : 0;

    if (action === "pause") { video.pause(); }
    else if (action === "resume") { video.play().catch(() => vsay("player.tapToResume")); }
    else if (action === "stop") { closeVideo(); return; }
    else if (action === "forward") { nudge(Number(cmd.seconds) || SEEK_STEP_S); return; }
    else if (action === "back") { nudge(-(Number(cmd.seconds) || SEEK_STEP_S)); return; }
    else if (action === "seek") {
      if (!total) return;
      video.currentTime = Math.min(total, Math.max(0, Number(cmd.position) || 0));
    }
    else if (action === "restart") {
      // Watching again means skipping the sponsors again too
      for (const seg of adSegments) seg.done = false;
      skippedCount = 0; skippedSeconds = 0;
      video.currentTime = 0;
      video.play().catch(() => {});
    }
    else if (action === "end") { if (total) video.currentTime = total; }
    else if (action === "speed") { setRateValue(cmd.rate); }
    else if (action === "mute") { video.muted = true; }
    else if (action === "unmute") { video.muted = false; }
    else if (action === "captions_on") { await setCaptions(true); }
    else if (action === "captions_off") { await setCaptions(false); }
    else { return; }
    pushState();
  }

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const data = e.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "botSkin") {
      // Theme is separate from the skin: it also sets color-scheme, which
      // paints scrollbars and native controls.
      document.documentElement.dataset.theme = data.theme === "light" ? "light" : "dark";
      if (data.vars) for (const k in data.vars) document.documentElement.style.setProperty(k, data.vars[k]);
      if ((data.lang === "uk" || data.lang === "en") && data.lang !== lang) {
        lang = data.lang;
        applyI18n();
        say(statusKey[0], statusKey[1], statusKey[2]);
        if (vmsgKey) vsay(vmsgKey);
        if (!lastTracks.length && !player.classList.contains("on")) renderHome();
        renderSettings();
      }
      return;
    }
    // Commands only from the screen itself, never from anything else that
    // got a handle on this window.
    if (data.type === "botVideo" && e.origin === window.location.origin) botCommand(data);
  });

  /* Hidden but not closed: do not keep playing sound from an invisible app. */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && !video.paused) { video.pause(); pushState(); }
  });

  applyI18n();
  paintIcons();
  setPlayIcon(false);
  setMode(storageGet(MODE_KEY, "video"));
  loadSettings();
  q.value = storageGet(KEY, "");
  if (q.value) search(); else renderHome();
</script>
</body>
</html>
