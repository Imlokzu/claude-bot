[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bot-display"
version = "0.1.0"
description = "React display UI + FastAPI backend for Claude Bot with virtual screen testing"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
