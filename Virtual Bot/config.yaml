# «Клод Бот» — Virtual Bot: конфіг бекенду.
# УВАГА: тут НЕМАЄ секретів і не повинно бути.
# Токен OpenClaw: env OPENCLAW_TOKEN (пріоритет) або файл voice_loop_config нижче.
# Ключ Anthropic: тільки env ANTHROPIC_API_KEY.

server:
  host: 127.0.0.1
  port: 8100

# Музика на екрані (Now Playing). Пошук і субтитри — YouTube напряму
# (yt-dlp / youtube-transcript-api), а АУДІО тягнемо через Invidious:
# `local=true` проксіює стрім крізь інстанс, бо прямі googlevideo-ссилки
# з багатьох IP віддають 403 (PO-токен-гейт). Перший живий інстанс виграє.
music:
  # Публічні інстанси флапають (хвилина працює — хвилина 502), тому їх
  # кілька і код пробує їх по колу. Для реального бота найстабільніше —
  # підняти СВІЙ Invidious (docker, ~200 МБ RAM) і вписати його ПЕРШИМ:
  #   - http://127.0.0.1:8343
  invidious_instances:
    - https://invidious.f5.si
    - https://inv.nadeko.net
    - https://invidious.nerdvpn.de

# Omni-роутер — ГОЛОВНИЙ мозок чату (OpenAI-сумісний мультимодельний шлюз).
# У ланцюжку мозків пробується ПЕРШИМ (див. brains.py).
# КЛЮЧ — секрет: тільки env OMNI_API_KEY (файл .env, який читає app_config).
# У config.yaml / фронтенді / вікі ключа НЕ пишемо.
#
# УВАГА: у списку — лише моделі провайдерів, для яких у ключа Є креденшели
# (перевірено: працюють ЛИШЕ провайдери `claude` та `opencode-go`; github/*,
# fireworks/*, codex/* тощо повертають 404 «No active credentials» / 401).
# Використовуємо ПРЯМІ id провайдера (claude/…, opencode-go/…), а не auto/*,
# бо auto/* комбо-маршрутизує і може влучати в мертві провайдери (503).
omni:
  base_url: http://localhost:20128/v1
  # Типова модель — БЕЗКОШТОВНА (contributor-free на OpenCode Zen), тому
  # звичайна розмова не витрачає платну квоту. Перевірено живим запитом.
  default_model: opencode/muse-spark-1.2-contributor-free
  # Запасна в межах Omni: якщо обрана відповіла швидкою помилкою
  # (401/404/503), пробуємо цю, і лише потім падаємо на наступний мозок.
  #
  # 2026-08-28: попередня запасна `opencode/nemotron-3.5-lightning-free`
  # ПОМЕРЛА — Zen віддає «Upstream request failed: [404]» на кожен запит
  # (перевірено 3/3). Замінено на gpt-oss-20b через Regolo: він іде ПОВЗ
  # opencode (прямий OpenAI-виклик у шимі), тому відповідає за ~0.4с проти
  # ~5с у будь-якої моделі через сесійне API. Для запасної, яку смикають
  # саме тоді, коли основна вже змарнувала час, швидкість важливіша за розум.
  fallback_model: regolo/gpt-oss-20b
  # Vision: перевірена модель, що приймає картинки.
  vision_model: opencode-go/minimax-m3
  timeout_s: 60
  # Тут ЛИШЕ те, що реально відповіло на тестовий запит через роутер
  # (див. omni_shim.py). Мертвий пункт у списку гірший за його відсутність.
  #
  # Провайдер `opencode` (OpenCode Zen) має і безкоштовні, і платні моделі:
  # усе з суфіксом `-free` працює, а `opencode/claude-*` віддає
  # «No payment method». Провайдерів `claude/*` і `regolo/*` у роутері
  # немає взагалі — саме через них типова модель раніше гарантовано падала.
  models:
    # --- безкоштовні (OpenCode Zen) ---
    - {id: opencode/muse-spark-1.2-contributor-free, label: "Muse Spark 1.2 (безкоштовна)"}
    - {id: opencode/nemotron-3-ultra-free, label: "Nemotron 3 Ultra (безкоштовна)"}
    - {id: opencode/mimo-v2.5-free, label: "MiMo v2.5 (безкоштовна)"}
    - {id: opencode/hy3-free, label: "HY3 (безкоштовна)"}
    - {id: opencode/x-preview-f-free, label: "X Preview F (безкоштовна)"}
    # --- opencode-go (власна квота) ---
    - {id: opencode-go/kimi-k3, label: "Kimi K3"}
    # GLM-5.3-Flash (реліз 26.08.2026): 320B total / 18B active, 1M контексту,
    # нативно мультимодальна — приймає картинки без окремої vision-моделі.
    # Живий тест через шим: текст ~7.5с, картинку описала правильно (~11с).
    # «Flash» тут про ЦІНУ токена, а не про латентність: minimax-m3 у нас
    # відповідає втричі швидше, тому vision_model лишається на ньому.
    # GLM-5.2 прибрано: 5.3-flash обходить її з великим відривом і на бенчах
    # (DeepSWE 63.4 vs 46.2), і в ціні, а картинок 5.2 не бачить узагалі.
    - {id: opencode-go/glm-5.3-flash, label: "GLM-5.3 Flash (бачить картинки)"}
    - {id: opencode-go/glm-5.3, label: "GLM-5.3"}
    - {id: opencode-go/deepseek-v4-pro, label: "DeepSeek V4 Pro"}
    - {id: opencode-go/qwen3.7-max, label: "Qwen 3.7 Max"}
    - {id: opencode-go/grok-4.5, label: "Grok 4.5"}
    - {id: opencode-go/minimax-m3, label: "MiniMax M3 (бачить картинки)"}
    # --- regolo (прямо, повз opencode; ключ той самий, що й для ASR) ---
    # Сенс цих двох — ШВИДКІСТЬ: ~0.4–0.6с на відповідь проти ~5с у всього
    # вище (там на кожен запит створюється сесія opencode з власним агентним
    # циклом). Розуму менше, зате для коротких питань різниця відчутна.
    # Картинок НЕ приймають — шим на такий запит чесно віддає 400.
    - {id: regolo/gpt-oss-20b, label: "GPT-OSS 20B (найшвидша)"}
    - {id: regolo/gpt-oss-120b, label: "GPT-OSS 120B (швидка)"}

asr:
  # auto: локальний faster-whisper, якщо встановлений; інакше Regolo fallback.
  # Щоб примусово працювати без хмари, постав provider: whisper_local.
  provider: auto
  base_url: https://api.regolo.ai/v1
  model: faster-whisper-large-v3
  local_model: large-v3-turbo # або large-v3 для максимальної точності
  local_device: cpu           # cuda для NVIDIA; macOS працює через CPU
  local_compute_type: int8
  local_beam_size: 3
  language: uk
  timeout_s: 45
  max_upload_bytes: 10485760

# Кодинг-режим: код пише omp (oh-my-pi), а не мозок чату. Модель — через
# Regolo (той самий акаунт, що й ASR: env REGOLO_ASR_API_KEY).
coding:
  profile: claude-bot        # ізольований профіль omp — особистий omp не чіпаємо
  # Модель ЗАВЖДИ у формі «провайдер/модель». Без провайдера omp робить
  # нечіткий збіг за своїм ВЛАСНИМ реєстром і влучає в платний двійник:
  # «muse-spark» давав 401 «No payment method».
  #
  # kimi-k2.7-code — кодингова модель OpenCode Go, перевірена на живому:
  # реальний tool-call, файл створено, ~4с. Безкоштовні альтернативи, які
  # теж пройшли перевірку: opencode-zen/hy3-free,
  # opencode-zen/nemotron-3.5-lightning-free.
  #
  # muse-spark тут НЕ ставимо: omp падає на її стрімі (див. коментар у
  # ~/.omp/profiles/claude-bot/agent/models.yml). У чаті вона працює.
  model: opencode-go/kimi-k2.7-code
  # Список для вибору в панелі. Як і в omni.models — ЛИШЕ те, що реально
  # створило файл справжнім tool-call. Кожен id у формі «провайдер/модель»:
  # без провайдера omp робить нечіткий збіг за своїм реєстром і влучає в
  # платний двійник.
  models:
    - {id: opencode-go/kimi-k2.7-code, label: "Kimi K2.7 Code"}
    - {id: opencode-go/deepseek-v4-pro, label: "DeepSeek V4 Pro"}
    - {id: opencode-go/kimi-k3, label: "Kimi K3"}
    # Перевірено на живому: справжній tool-call, файл створено, ~25с.
    # Модель зареєстрована у ~/.omp/profiles/claude-bot/agent/models.yml.
    - {id: opencode-go/glm-5.3-flash, label: "GLM-5.3 Flash"}
    - {id: opencode-zen/hy3-free, label: "HY3 (безкоштовна)"}
    - {id: opencode-zen/nemotron-3.5-lightning-free, label: "Nemotron 3.5 Lightning (безкоштовна)"}
    - {id: regolo/qwen3-coder-next, label: "Qwen3 Coder Next (Regolo)"}
  max_time_s: 900            # запобіжник: сесія не крутиться вічно

openclaw:
  base_url: http://127.0.0.1:18789
  agent: openclaw/default
  # Звідки взяти токен, якщо env OPENCLAW_TOKEN не задано (шлях відносно цієї папки)
  voice_loop_config: "../Voice Loop/config.yaml"
  timeout_s: 45

# Чат: захист від «повільно вмираючих» мозків Omni/OpenClaw (див. brains.py).
chat:
  # Стеля ОДНІЄЇ спроби Omni в чаті (обидві моделі: основна + запасна разом),
  # коротша за omni.timeout_s, щоб завислий роутер не тримав чат десятки секунд
  omni_timeout_s: 25
  # Запобіжник (circuit breaker) Omni: після невдачі в чаті пропускаємо Omni
  # стільки секунд; успішна відповідь скидає запобіжник
  omni_backoff_s: 60
  # Таймаут ОДНІЄЇ спроби OpenClaw у чаті. OpenClaw тепер ГОЛОВНИЙ мозок і робить
  # реальну агентну роботу (памʼять, tools, маршрутизація до Claude), тож
  # відповідь легітимно триває довше — 60с (не 10), інакше чат марно падав на Omni.
  # Було 60 — і коли OpenClaw підвисав, чат стояв ХВИЛИНУ, перш ніж
  # відповісти через Omni (заміряно: 65с). Виміряні реальні відповіді
  # OpenClaw на звичайну репліку: 8.4 / 16.6 / 16.8с. 35с дає вдвічі
  # більше запасу за спостережуваний максимум — тобто довший хід не
  # падає на Omni марно (саме цього боявся попередній коментар), але
  # завислий шлюз коштує 35с, а не хвилину.
  openclaw_timeout_s: 35
  # Запобіжник (circuit breaker): після невдалої спроби OpenClaw у чаті
  # пропускаємо його стільки секунд; успішна відповідь скидає запобіжник.
  # 30с (а не 120) — щоб під час налаштування OpenClaw чат швидко перемкнувся
  # на нього, щойно провайдера полагоджено.
  openclaw_backoff_s: 30

anthropic:
  # Базовий URL Messages API. Офіційний — https://api.anthropic.com;
  # сумісний шлюз-посередник вказується тут же (шлях /v1/messages дописується сам).
  #
  # ЗАРАЗ тут SotaModel (www.sotamodel.net) — сторонній Claude-шлюз, що говорить
  # обома протоколами (Anthropic /v1/messages і OpenAI /chat/completions).
  # Ключ — env ANTHROPIC_API_KEY у .env: це ключ SotaModel, НЕ офіційного Anthropic.
  # Моделі з /v1/models цього шлюзу: claude-opus-5, claude-opus-5-max,
  # claude-opus-5-xhigh (і приховані model-S/O/A/T). Перемикати — полем model нижче.
  #
  # Стан на 2026-08-25: ключ валідний, але баланс акаунта 0 → кожен запит
  # відповідає INSUFFICIENT_BALANCE, тож ланцюг мозків цей крок перескакує на
  # Chat2API/демо. Поповниться баланс — мозок оживе без змін у коді.
  base_url: https://www.sotamodel.net
  model: claude-opus-5
  max_tokens: 1024
  timeout_s: 60

# Chat2API — локальний OpenAI-сумісний сервер (третій мозок у ланцюжку).
# Авторизація зазвичай не потрібна; якщо env CHAT2API_API_KEY задано —
# шлеться заголовок Authorization: Bearer (сам ключ у конфіг НЕ пишемо).
chat2api:
  base_url: http://127.0.0.1:8080/v1
  model: "Qwen3.7-Max"
  timeout_s: 60

vision:
  base_url: "http://127.0.0.1:8000"
  dir: "../Vision Agent"

display:
  base_url: "http://127.0.0.1:8001"
  dir: "../claude-bot-display"
  # Таймаут однієї відправки подій на дисплей через WS-міст (максимум 1.5 с)
  bridge_timeout_s: 1.5

# «Живий бот»: інтервали й кулдауни фонового нагляду (усе в секундах)
liveliness:
  vision_poll_s: 2          # опитування Vision, коли він онлайн
  vision_offline_poll_s: 10 # тиха перевірка доступності, коли офлайн
  greet_cooldown_s: 60      # мінімум між привітаннями при появі обличчя
  face_gone_stable_s: 10    # стільки секунд без облич = «людина пішла»
  sad_duration_s: 5         # тривалість суму після зникнення обличчя
  motion_cooldown_s: 5      # мінімум між подіями руху
  sleepy_after_s: 600      # без взаємодій → дрімота (10 хв)
  # Спонтанні емоції у простої: бот САМ зрідка «оживає» (працює й без Vision).
  # 0 у mood_duration_s повністю вимикає цю поведінку.
  mood_min_s: 25            # мінімальна пауза між спонтанними емоціями
  mood_max_s: 75            # максимальна пауза між спонтанними емоціями
  mood_duration_s: 4        # скільки тримається спонтанна емоція, потім → idle
  mood_calm_s: 12           # спонтанні емоції лише коли стільки с не було взаємодії

paths:
  # Три ОКРЕМІ корені даних. Усі під user_data/ — вона в .gitignore, тож нічого
  # особистого не потрапляє в репозиторій і не качається разом з кодом.
  brain_dir: "user_data/owner/brain"          # інфа про користувача: профіль, нотатки, памʼять, журнали
  workspace_dir: "user_data/owner/workspace"  # файли бота: ігри, нотатки, завантаження, теки сесій
  code_dir: "user_data/owner/code"            # код-проєкти; ТІЛЬКИ цю теку бачить кодинг-агент
  static_dir: "static"
  service_logs_dir: "service_logs"
