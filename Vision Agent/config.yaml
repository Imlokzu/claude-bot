# Клод Бот — конфіг Vision Agent (Крок 1)
#
# Перемикач режиму обробки закладаємо одразу, навіть коли зараз усе локально —
# щоб пізніше просто змінити значення тут, а не переписувати код.

vision:
  # local  — уся обробка на цьому пристрої (Haar Cascade), без мережі, без затримки
  # cloud  — кадри йдуть на зовнішню vision-модель (Groq тощо) — додамо пізніше
  # hybrid — локальна детекція як тригер, cloud-виклик лише коли щось відбулось
  mode: local

  # поріг детекції руху: частка кадру, що змінилась, щоб рахувати це рухом
  motion_min_area_ratio: 0.01

  # мінімальний розмір обличчя в пікселях (ширина, висота), яке ще вважаємо обличчям
  min_face_size: [40, 40]

  # індекс камери для GET /vision/snapshot (0 = типова вебка ноута)
  camera_index: 0

  # роздільність захоплення [ширина, висота] — камера підтримує апаратний
  # MJPG (стиснення прямо в камері), тому 640x480 читається так само швидко,
  # як 320x240 у сирому режимі (~40мс/кадр на RPi3 + Logitech C170)
  capture_resolution: [640, 480]

  # ширина, до якої масштабується кадр перед Haar Cascade (detectMultiScale)
  # — сама детекція на RPi3 при повній 640px ширині займала 140-200мс,
  # на 320px ~35-50мс; координати рамок масштабуються назад автоматично
  detect_width: 320

server:
  host: 0.0.0.0
  port: 8000
