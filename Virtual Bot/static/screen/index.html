<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit + user-scalable=no: це «пристрій», а не сторінка; зум і
       випадковий подвійний тап на резистивному тачі тільки заважають -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Клод Бот — Екран</title>
  <link rel="stylesheet" href="/static/screen/screen.css">
</head>
<body>

<!-- Сцена рівно 320×240 (2.4" SPI). На справжньому екрані масштаб = 1,
     на десктопі — вписується в вікно. Все всередині рахує в цих пікселях. -->
<div class="stage" id="stage">

  <!-- ── Шар 1: карусель тайлів (горизонтальний свайп) ────────────── -->
  <div class="rail" id="rail">

    <!-- Тайл 0 — «циферблат»: краб + час + стан -->
    <section class="tile tile-face" data-tile="face" data-emotion="idle">
      <div class="face-top">
        <span class="link-dot" id="linkDot" data-i18n-title="face.link" title="Звʼязок із ботом"></span>
        <canvas class="face-clock" id="faceClockCanvas" width="76" height="20"></canvas>
      </div>
      <canvas class="crab" id="crabCanvas" width="300" height="152"></canvas>
      <div class="face-label" id="faceLabel" data-i18n="emo.idle">Очікування</div>

      <!-- Розмова просто на циферблаті: що кажеш ти і що відповідає бот -->
      <div class="face-caption hidden" id="faceCaption"></div>
      <!-- «1/3»: показуємо ЛИШЕ коли репліка не влізла — інакше зайвий шум -->
      <div class="caption-page hidden" id="captionPage"></div>
      <!-- Бот показує картинку: ОДНА рамка, одна картинка, гортання -->
      <div class="face-photo hidden" id="facePhoto">
        <img id="facePhotoImg" alt="">
        <button class="photo-nav prev" id="facePhotoPrev" type="button" aria-label="Попередня">‹</button>
        <button class="photo-nav next" id="facePhotoNext" type="button" aria-label="Наступна">›</button>
        <div class="photo-dots" id="facePhotoDots"></div>
      </div>
      <!-- Краб, що тримає рамку: клешні заходять на її нижній край -->
      <canvas class="face-holder hidden" id="faceHolder" width="33" height="30"></canvas>

      <!-- Говорити можна прямо звідси, не заходячи в тайл розмови -->
      <button class="face-mic" id="faceMic" data-mic type="button" data-i18n-aria="face.mic" aria-label="Говорити">
        <span class="ico-slot" id="faceMicIco"></span>
      </button>
    </section>

    <!-- Тайл 1 — годинник -->
    <section class="tile tile-clock" data-tile="clock">
      <canvas class="clock-pixels" id="clockCanvas" width="288" height="96"></canvas>
      <div class="clock-date" id="clockDate">—</div>
    </section>

    <!-- Тайл 2 — остання репліка бота -->
    <section class="tile tile-say" data-tile="say">
      <div class="tile-head" data-i18n="say.head">Бот сказав</div>
      <div class="say-text" id="sayText">Поки тиша.</div>
      <div class="say-photo hidden" id="sayPhoto"></div>
      <div class="tile-foot" id="sayAge"></div>
    </section>

    <!-- Тайл 3 — стан систем. Одна головна дія — «Оновити» (як у Wear OS) -->
    <section class="tile tile-state" data-tile="state">
      <div class="tile-head" data-i18n="state.head">Стан</div>
      <ul class="state-list">
        <li><span class="k" data-i18n="state.brain">Мозок</span><span class="v" id="stBrain">—</span></li>
        <li><span class="k" data-i18n="state.vision">Зір</span><span class="v" id="stVision">—</span></li>
        <li><span class="k" data-i18n="state.display">Дисплей</span><span class="v" id="stDisplay">—</span></li>
        <li><span class="k" data-i18n="state.link">Звʼязок</span><span class="v" id="stLink">—</span></li>
      </ul>
      <div class="tile-foot" id="stAge"></div>
      <button class="cta" id="stRefresh" type="button" data-i18n="common.refresh">Оновити</button>
    </section>

    <!-- Тайл 4 — розмова: голосом, без клавіатури (її тут нема куди діти) -->
    <section class="tile tile-chat" data-tile="chat">
      <div class="chat-head">
        <button class="chat-head-btn" id="sessionsBtn" type="button">
          <span class="ico-slot" id="sessionsIco"></span>
          <span class="chat-title" id="sessionTitle" data-i18n="chat.title">Розмова</span>
        </button>
        <button class="chat-head-btn icon-only" id="chatNew" type="button" data-i18n-title="chat.new" title="Нова розмова">
          <span class="ico-slot" id="chatNewIco"></span>
        </button>
      </div>

      <div class="chat-log" id="chatLog">
        <div class="chat-empty" id="chatEmpty" data-i18n="chat.empty">Натисни мікрофон і говори.</div>
      </div>

      <!-- Те, що чуємо просто зараз (проміжний результат розпізнавання) -->
      <div class="chat-live" id="chatLive"></div>

      <div class="chat-bar">
        <button class="mic-btn" id="micBtn" data-mic type="button">
          <span class="ico-slot" id="micIco"></span>
          <span class="mic-label" id="micLabel" data-i18n="voice.speak">Говорити</span>
        </button>
        <button class="mode-chip" id="modeChip" type="button" data-i18n-title="mode.head" title="Режим розмови">Поговорити</button>
      </div>

      <!-- Список розмов поверх тайла -->
      <div class="sessions hidden" id="sessionsPanel">
        <div class="sessions-head">
          <span data-i18n="chat.sessions">Розмови</span>
          <button class="layer-back" id="sessionsClose" type="button" data-i18n="common.back">Назад ✕</button>
        </div>
        <div class="sessions-list" id="sessionsList"></div>
      </div>
    </section>

  </div>

  <!-- Крапки-індикатор тайлів -->
  <div class="dots" id="dots" aria-hidden="true"></div>

  <!-- ── Now Playing: музика, видно з будь-якого тайла ───────────────
       Ліва іконка — джерело (тап: змінити провайдер), посередині назва
       (довга — біжить, як стрічка над магазином), праворуч — пуск/пауза.
       Тонка смужка прогресу по верхньому краю; тап по назві — повний плеєр
       з перемоткою. Коли екран «спить», музика грає далі (як радіобудильник). -->
  <div class="nowplaying hidden" id="nowPlaying">
    <div class="np-progress" aria-hidden="true"><i id="npProgress"></i></div>
    <div class="np-row">
      <button class="np-btn np-provider" id="npProvider" type="button" data-i18n-title="music.source" title="Джерело музики">
        <span class="ico-slot" id="npProviderIco"></span>
      </button>
      <button class="np-title" id="npTitleBtn" type="button">
        <span class="np-track" id="npTrack">
          <span class="np-text" id="npText" data-i18n="music.off">Музика вимкнена</span>
        </span>
      </button>
      <button class="np-btn np-toggle" id="npToggle" type="button">
        <span class="ico-slot" id="npToggleIco"></span>
      </button>
    </div>
  </div>


  <!-- ── Шторка швидких дій: свайп ВНИЗ, виїжджає згори ── -->
  <section class="layer layer-quick" id="layerQuick">
    <div class="layer-head">
      <span data-i18n="quick.head">Швидкі дії</span>
      <span class="head-btns">
        <button class="layer-edit" id="quickEdit" type="button" data-i18n-title="quick.edit" title="Переставити плитки"></button>
        <button class="layer-back" data-back type="button" data-i18n="common.back">Назад ✕</button>
      </span>
    </div>

    <!-- Повзунки: обидва керують справжніми речами -->
    <div class="qs-slider">
      <span class="qs-slider-ico" id="brightIco"></span>
      <input type="range" id="brightRange" min="15" max="100" step="5" data-i18n-aria="quick.bright" aria-label="Яскравість">
      <span class="qs-slider-val" id="brightVal">100%</span>
    </div>
    <div class="qs-slider" id="volRow">
      <span class="qs-slider-ico" id="volIco"></span>
      <input type="range" id="volRange" min="0" max="100" step="5" data-i18n-aria="quick.volume" aria-label="Гучність">
      <span class="qs-slider-val" id="volVal">70%</span>
    </div>

    <div class="qs-grid" id="quickGrid"></div>
    <div class="qs-hint" id="quickHint" data-i18n="quick.hint">Торкнись двох плиток, щоб поміняти їх місцями</div>
  </section>

  <!-- Шухляда застосунків: свайп ВГОРУ (там, де раніше була стрічка) -->
  <section class="layer layer-apps" id="layerApps" aria-labelledby="appsTitle" aria-hidden="true" inert>
    <div class="apps-handle" aria-hidden="true"></div>
    <div class="layer-head apps-head">
      <span id="appsTitle" data-i18n="apps.head">Застосунки</span>
      <button class="layer-back" data-apps-close type="button" data-i18n="common.back">Назад ✕</button>
    </div>
    <div class="apps-grid" id="appsGrid"></div>
  </section>

  <!-- Застосунок поверх усього (камера, сервіси) -->
  <section class="layer layer-app" id="layerApp">
    <div class="layer-head">
      <span id="appTitle" data-i18n="app.head">Застосунок</span>
      <button class="layer-back" data-app-close type="button" data-i18n="common.back">Назад ✕</button>
    </div>
    <div class="app-body" id="appBody"></div>
  </section>

  <!-- Вибір режиму розмови (довгий дотик по мікрофону або чип) -->
  <div class="mode-sheet hidden" id="modeSheet">
    <div class="mode-card">
      <div class="mode-head">
        <span data-i18n="mode.head">Режим розмови</span>
        <button class="layer-back" data-mode-close type="button">✕</button>
      </div>
      <button class="mode-row" data-mode="push" type="button">
        <span class="mode-name" data-i18n="mode.push">Поговорити</span>
        <span class="mode-hint" data-i18n="mode.push.hint">Тиснеш — кажеш фразу — бот відповідає</span>
      </button>
      <button class="mode-row" data-mode="open" type="button">
        <span class="mode-name" data-i18n="mode.open">Слухає завжди</span>
        <span class="mode-hint" data-i18n="mode.open.hint">Мікрофон відкритий, кожна фраза йде боту</span>
      </button>
      <button class="mode-row" data-mode="wake" type="button">
        <span class="mode-name" data-i18n="mode.wake">Ключове слово</span>
        <span class="mode-hint" data-i18n="mode.wake.hint">Реагує лише після свого імені</span>
      </button>
    </div>
  </div>

  <!-- Вибір стилю іконок -->
  <div class="mode-sheet hidden" id="iconSheet">
    <div class="mode-card">
      <div class="mode-head">
        <span data-i18n="icons.head">Іконки</span>
        <button class="layer-back" data-icons-close type="button">✕</button>
      </div>
      <button class="mode-row" data-icons="pixel" type="button">
        <span class="mode-name" data-i18n="icons.pixel">Наші (піксельні)</span>
        <span class="mode-hint" data-i18n="icons.pixel.hint">Одна мова з крабом і годинником</span>
      </button>
      <button class="mode-row" data-icons="line" type="button">
        <span class="mode-name" data-i18n="icons.line">Звичайні</span>
        <span class="mode-hint" data-i18n="icons.line.hint">Контурні, як у телефоні</span>
      </button>
      <button class="mode-row" data-icons="color" type="button">
        <span class="mode-name" data-i18n="icons.color">Кольорові</span>
        <span class="mode-hint" data-i18n="icons.color.hint">Ті самі, але кожна у своєму відтінку</span>
      </button>
    </div>
  </div>

  <!-- Плеєр: джерело музики, перемотка, черга -->
  <div class="mode-sheet hidden" id="musicSheet">
    <div class="mode-card music-card">
      <div class="mode-head">
        <span data-i18n="music.head">Музика</span>
        <button class="layer-back" data-music-close type="button">✕</button>
      </div>

      <!-- Джерело: тап — змінити. YouTube шукається голосом через бота,
           радіо тапається прямо зі списку нижче -->
      <div class="np-providers" id="npProviders">
        <button class="np-provider-chip" data-provider="youtube" type="button">
          <span class="ico-slot" id="npProvYoutubeIco"></span>YouTube
        </button>
        <button class="np-provider-chip" data-provider="radio" type="button">
          <span class="ico-slot" id="npProvRadioIco"></span><span data-i18n="music.radio">Радіо</span>
        </button>
      </div>

      <!-- Поточний трек: назва біжить, якщо не влазить -->
      <div class="np-now" id="npNow">
        <span class="np-track" id="npTrack2"><span class="np-text" id="npNowTitle">—</span></span>
        <span class="np-sub" id="npNowSub"></span>
      </div>

      <!-- Перемотка: для живого радіо ховається (його не можна мотати) -->
      <input type="range" class="np-seek" id="npSeek" min="0" max="1000" value="0" data-i18n-aria="music.seek" aria-label="Позиція трека">
      <div class="np-times" id="npTimes"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>

      <div class="np-controls">
        <button class="np-btn" id="npPrev" type="button" data-i18n-aria="music.prev" aria-label="Попередній"><span class="ico-slot" id="npPrevIco"></span></button>
        <button class="np-btn np-big" id="npBigToggle" type="button" data-i18n-aria="music.playPause" aria-label="Грати/пауза"><span class="ico-slot" id="npBigIco"></span></button>
        <button class="np-btn" id="npNext" type="button" data-i18n-aria="music.next" aria-label="Наступний"><span class="ico-slot" id="npNextIco"></span></button>
      </div>

      <div class="np-list" id="npList"></div>
    </div>
  </div>



  <!-- Затемнення: яскравість і «сон». Окремий шар з opacity —
       композитор тягне його безкоштовно, на відміну від filter. -->
  <div class="dimmer" id="dimmer"></div>

</div>

<script src="/static/audio-level.js"></script>
<script src="/static/crab.js"></script>
<script type="module" src="/static/screen/screen.js"></script>
</body>
</html>
