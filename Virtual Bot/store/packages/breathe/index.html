<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Breathe</title>
  <style>
    /* Shared look of the bot's own apps: the screen palette (skins overwrite
       these eight variables at runtime), one bar, one button, one segment. */
    :root {
      --bg: #16181a; --panel: #1e2124; --line: #2f3438; --text: #e8e4dc;
      --muted: #8e9498; --accent: #d17a58; --ok: #8ca879; --off: #6b7175;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #efe7d9; --panel: #fbf6ec; --line: #ddcdb2; --text: #2f271f;
      --muted: #7d6d5c; --accent: #b95f3d; --ok: #6f8b5f; --off: #a8998a;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; color: inherit; }
    .app { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; padding: 6px 8px 8px; gap: 6px; }
    .bar { display: flex; align-items: center; gap: 6px; flex: none; min-height: 28px; }
    .bar-title { flex: 1; min-width: 0; overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .chip { display: inline-flex; align-items: baseline; gap: 4px; flex: none; padding: 4px 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .chip b { color: var(--text); font-size: 12px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none; min-width: 28px; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 11px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .btn:active { border-color: var(--accent); color: var(--accent); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: var(--bg); }
    .btn.primary:active { opacity: .75; color: var(--bg); }
    .btn.icon { width: 28px; padding: 0; }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .35; pointer-events: none; }
    .seg { display: flex; gap: 6px; flex: none; padding: 2px; border: 1px solid var(--line); border-radius: 9px; }
    .seg button { flex: 1; min-width: 0; min-height: 24px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
    .seg button.on { background: var(--panel); color: var(--text); }
    .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
    .main { display: flex; flex: 1; min-height: 0; gap: 8px; }
    .stage { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 0; }
    .orb { position: relative; }
    .orb-guide { position: absolute; inset: 0; border: 1px dashed var(--line); border-radius: 50%; }
    .orb-min { position: absolute; inset: 27.5%; border: 1px solid var(--line); border-radius: 50%; }
    .orb-ball { position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 50%; background: var(--accent); transform: scale(.45); transition-property: transform; transition-timing-function: cubic-bezier(.45, 0, .55, 1); will-change: transform; }
    .orb-fill { position: absolute; inset: 0; border-radius: 50%; background: var(--bg); opacity: .72; }
    .orb-copy { position: absolute; inset: 0; padding: 0 30%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
    .orb-phase { font-size: 13px; font-weight: 800; letter-spacing: -.01em; }
    .orb-count { color: var(--muted); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .orb-count.idle { font-size: 9px; font-weight: 600; line-height: 1.25; }
    .side { display: flex; flex-direction: column; gap: 6px; width: 108px; flex: none; }
    .mode { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
    .mode b { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .mode span { color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .mode.on { border-color: var(--accent); background: var(--panel); }
    .mode.on b { color: var(--accent); }
    .side .spacer { flex: 1; }
    #toggle { width: 100%; }
    @media (max-height: 200px) { .mode { min-height: 30px; padding-block: 2px; } .mode span { display: none; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="bar">
      <span class="bar-title" data-i18n="title"></span>
      <span class="chip"><span data-i18n="cycles"></span><b id="cycles">0</b></span>
    </header>
    <main class="main">
      <div class="stage" id="stage">
        <div class="orb" id="orb">
          <div class="orb-guide"></div>
          <div class="orb-min"></div>
          <div class="orb-ball" id="ball"><div class="orb-fill"></div></div>
          <div class="orb-copy"><div class="orb-phase" id="phase"></div><div class="orb-count" id="count"></div></div>
        </div>
      </div>
      <aside class="side">
        <button class="mode" type="button" data-mode="box"><b>4-4-4-4</b><span data-i18n="boxName"></span></button>
        <button class="mode" type="button" data-mode="relax"><b>4-7-8</b><span data-i18n="relaxName"></span></button>
        <span class="spacer"></span>
        <button class="btn primary" id="toggle" type="button"></button>
      </aside>
    </main>
  </div>
  <script>
    const APP_ID = "breathe";
    const STR = {
      uk: {
        title: "Дихання", cycles: "Цикли", boxName: "Квадрат", relaxName: "Розслаблення",
        start: "Почати", stop: "Стоп", ready: "Готові?", readySub: "Сядь зручно",
        in: "Вдих", hold: "Затримка", out: "Видих",
      },
      en: {
        title: "Breathe", cycles: "Cycles", boxName: "Box", relaxName: "Relax",
        start: "Start", stop: "Stop", ready: "Ready?", readySub: "Sit comfortably",
        in: "Breathe in", hold: "Hold", out: "Breathe out",
      },
    };
    const ICONS = {
      play: '<path d="M8 5.4v13.2L19.2 12z"/>',
      pause: '<path d="M8.6 5.5v13M15.4 5.5v13"/>'
    };
    /* ---- shared app runtime: storage, i18n, skin, parent messages ---- */

    // Storage throws inside a sandboxed iframe (a shared .cbp runs with an
    // opaque origin), so every access is guarded and the app keeps its state
    // in memory instead of failing.
    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(APP_ID + "." + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
    }

    // Start in the screen's language; botSkin carries it later, which also
    // covers the sandbox where localStorage is not readable.
    let lang = "uk";
    try { lang = localStorage.getItem("botScreenLang") || "uk"; } catch (_) {}
    if (lang !== "en") lang = "uk";

    function t(key, vars) {
      let text = STR[lang][key];
      if (text == null) text = STR.uk[key];
      if (text == null) return key;
      if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
      return text;
    }
    function icon(name, cls) {
      return '<svg class="i' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
    }
    function fillIcons(root) {
      (root || document).querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
    }
    function applyI18n() {
      document.documentElement.lang = lang;
      document.title = t("title");
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
      if (typeof onLang === "function") onLang();
    }
    // "*" on purpose: in a sandbox our origin is "null", and naming a real
    // origin as the target would silently drop the message.
    function post(message) {
      try { window.parent.postMessage(message, "*"); } catch (_) {}
    }
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    let skinKeys = [];
    window.addEventListener("message", (event) => {
      // Only the source is checked: a sandboxed frame sees origin "null".
      if (event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.type !== "botSkin") return;
      const root = document.documentElement;
      // Drop the previous skin first, otherwise removing a skin would leave
      // its colours behind.
      skinKeys.forEach((key) => root.style.removeProperty(key));
      skinKeys = [];
      if (data.vars && typeof data.vars === "object") {
        for (const key in data.vars) {
          if (!/^--[a-z-]+$/.test(key)) continue;
          root.style.setProperty(key, String(data.vars[key]));
          skinKeys.push(key);
        }
      }
      root.dataset.theme = data.theme === "light" ? "light" : "dark";
      if (typeof onTheme === "function") onTheme();
      if ((data.lang === "uk" || data.lang === "en") && data.lang !== lang) {
        lang = data.lang;
        applyI18n();
      }
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-close]")) post({ type: "closeStoreApp" });
    });
    // Swipe left/right/down closes the app, same gesture as the screen's own
    // layers. Pointer capture keeps the swipe alive when the finger leaves a
    // small element; a native scroll cancels the pointer and is not a swipe.
    function enableSwipeClose(root) {
      let start = null;
      root.addEventListener("pointerdown", (event) => {
        if (start || event.target.closest("input, select, textarea, [data-noswipe]")) return;
        start = { x: event.clientX, y: event.clientY, id: event.pointerId };
        if (!event.target.closest("button")) {
          try { root.setPointerCapture(event.pointerId); } catch (_) {}
        }
      });
      function finish(event) {
        if (!start || start.id !== event.pointerId) return;
        const s = start;
        start = null;
        try { if (root.hasPointerCapture(s.id)) root.releasePointerCapture(s.id); } catch (_) {}
        if (event.type === "pointercancel") return;
        const dx = event.clientX - s.x;
        const dy = event.clientY - s.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
        if (Math.abs(dx) >= Math.abs(dy)) post({ type: "storeAppSwipe", direction: dx < 0 ? "left" : "right" });
        else if (dy > 0) post({ type: "storeAppSwipe", direction: "down" });
      }
      root.addEventListener("pointerup", finish);
      root.addEventListener("pointercancel", finish);
      window.addEventListener("pointerup", finish);
      window.addEventListener("pointercancel", finish);
      root.addEventListener("lostpointercapture", (event) => { if (start && start.id === event.pointerId) start = null; });
    }

    const PATTERNS = {
      box: [["in", 4], ["hold", 4], ["out", 4], ["hold", 4]],
      relax: [["in", 4], ["hold", 7], ["out", 8]],
    };
    const SMALL = .45;
    const ball = document.getElementById("ball");
    let mode = load("mode", "box") === "relax" ? "relax" : "box";
    let running = false, step = 0, cycles = 0, phaseStart = 0, phaseTimer = 0, countTimer = 0;

    function setBall(scale, seconds) {
      ball.style.transitionDuration = seconds + "s";
      ball.style.transform = "scale(" + scale + ")";
    }

    function runPhase() {
      const [kind, secs] = PATTERNS[mode][step];
      phaseStart = performance.now();
      if (kind === "in") setBall(1, secs);
      if (kind === "out") setBall(SMALL, secs);
      renderCopy();
      clearInterval(countTimer);
      countTimer = setInterval(renderCopy, 200);
      phaseTimer = setTimeout(() => {
        step += 1;
        if (step >= PATTERNS[mode].length) { step = 0; cycles += 1; document.getElementById("cycles").textContent = cycles; }
        runPhase();
      }, secs * 1000);
    }

    function start() {
      running = true; step = 0; cycles = 0;
      document.getElementById("cycles").textContent = 0;
      runPhase();
      renderButtons();
    }
    function stop() {
      running = false;
      clearTimeout(phaseTimer); clearInterval(countTimer);
      setBall(SMALL, .6);
      renderCopy();
      renderButtons();
    }

    function renderCopy() {
      const phase = document.getElementById("phase");
      const count = document.getElementById("count");
      if (!running) {
        phase.textContent = t("ready");
        count.textContent = t("readySub");
        count.classList.add("idle");
        phase.style.color = "";
        return;
      }
      const [kind, secs] = PATTERNS[mode][step];
      const left = Math.max(1, Math.ceil(secs - (performance.now() - phaseStart) / 1000));
      phase.textContent = t(kind);
      phase.style.color = kind === "hold" ? "var(--muted)" : kind === "in" ? "var(--accent)" : "var(--ok)";
      count.classList.remove("idle");
      count.textContent = left;
    }

    function renderButtons() {
      document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
      const toggle = document.getElementById("toggle");
      toggle.innerHTML = icon(running ? "pause" : "play") + "<span></span>";
      toggle.lastChild.textContent = t(running ? "stop" : "start");
    }

    function layout() {
      const stage = document.getElementById("stage");
      const size = Math.max(90, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)) - 4);
      const orb = document.getElementById("orb");
      orb.style.width = orb.style.height = size + "px";
    }

    document.querySelector(".side").addEventListener("click", (event) => {
      const b = event.target.closest("[data-mode]");
      if (!b) return;
      mode = b.dataset.mode;
      save("mode", mode);
      if (running) { clearTimeout(phaseTimer); start(); }
      renderButtons();
    });
    document.getElementById("toggle").addEventListener("click", () => (running ? stop() : start()));
    // Timers are throttled in a hidden frame, which would desync the circle
    // from the count; stopping is more honest than a drifting guide.
    document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(); });
    window.addEventListener("resize", layout);

    function onLang() { renderCopy(); renderButtons(); }

    enableSwipeClose(document.getElementById("app"));
    fillIcons();
    layout();
    applyI18n();
  </script>
</body>
</html>
